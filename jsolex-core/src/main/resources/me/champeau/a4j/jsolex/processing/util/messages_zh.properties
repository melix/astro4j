cloud.model.map.t.description=**\u663e\u793a\u5185\u5bb9**\n\u5438\u6536\u7269\u8d28\u7684\u6e29\u5ea6\uff0c\u5355\u4f4d\u4e3a\u5f00\u5c14\u6587\uff08K\uff09\u3002\u4f5c\u4e3a\u6bd4\u8f83\uff0c\u592a\u9633\u53ef\u89c1\u8868\u9762\u7684\u6e29\u5ea6\u7ea6\u4e3a 5800 K\u3002H-alpha \u4e2d\u53ef\u89c1\u7684\u7ed3\u6784\u901a\u5e38\u5728 7000 \u81f3 15000 K \u4e4b\u95f4\u3002\n\n**\u6d4b\u91cf\u539f\u7406**\n\u5728\u70ed\u6c14\u4f53\u4e2d\uff0c\u539f\u5b50\u5411\u5404\u4e2a\u65b9\u5411\u5feb\u901f\u8fd0\u52a8\uff0c\u5b83\u4eec\u7684\u591a\u666e\u52d2\u4f4d\u79fb\u4f7f\u5438\u6536\u7ebf\u53d8\u5bbd\uff1a\u6c14\u4f53\u8d8a\u70ed\uff0c\u8c31\u7ebf\u8d8a\u5bbd\u3002\u6a21\u578b\u6d4b\u91cf\u4e91\u7684\u8c31\u7ebf\u5bbd\u5ea6\uff0c\u6263\u9664\u6e4d\u6d41\u7684\u8d21\u732e\uff08\u5047\u8bbe\u4e3a 8 km/s\uff09\uff0c\u518d\u5c06\u5269\u4f59\u90e8\u5206\u6362\u7b97\u4e3a\u6e29\u5ea6\u3002\n\n**\u5982\u4f55\u9605\u8bfb**\n\u4ece\u6df1\u7d2b\u8272\uff084000 K\uff09\u5230\u9ec4\u8272\uff0815000 K\uff09\u3002\u6df1\u7070\u8272\uff1a\u8be5\u70b9\u6ca1\u6709\u5438\u6536\u7269\u8d28\uff0c\u5438\u6536\u592a\u5f31\u65e0\u6cd5\u6d4b\u91cf\uff0c\u6216\u6bd4\u5468\u56f4\u66f4\u4eae\u7684\u533a\u57df\uff08\u8c31\u6591\uff09\uff0c\u4e91\u6a21\u578b\u4e0d\u9002\u7528\u3002\u8c31\u7ebf\u592a\u7a84\u3001\u4ec5\u6e4d\u6d41\u5c31\u8db3\u4ee5\u89e3\u91ca\u5176\u5bbd\u5ea6\u65f6\u4e5f\u4e3a\u6df1\u7070\u8272\u3002\n\n**\u53ef\u9760\u6027**\n\u8f83\u4f4e\u3002\u4eea\u5668\u672c\u8eab\u4e5f\u4f1a\u4f7f\u8c31\u7ebf\u53d8\u5bbd\uff0c\u8fd9\u4e00\u5c55\u5bbd\u5728\u5b9a\u6807\u65f6\u4f30\u8ba1\u3002\u8be5\u4f30\u8ba1\u6216\u5047\u8bbe\u6e4d\u6d41\u7684\u5fae\u5c0f\u8bef\u5dee\u90fd\u4f1a\u4f7f\u6e29\u5ea6\u53d8\u5316\u5f88\u5927\u3002\u4f7f\u7528\u4e1a\u4f59\u8bbe\u5907\u65f6\uff0c\u6bcf\u4e00\u70b9\u8fd8\u6df7\u5408\u4e86\u4ee5\u4e0d\u540c\u901f\u5ea6\u8fd0\u52a8\u7684\u7ed3\u6784\uff0c\u4f7f\u8c31\u7ebf\u8fdb\u4e00\u6b65\u53d8\u5bbd\uff1a\u6e29\u5ea6\u5f88\u53ef\u80fd\u88ab\u9ad8\u4f30\u3002\u8bf7\u6bd