cloud.model.map.vmax.description=**\u663e\u793a\u5185\u5bb9**\n\u8be5\u70b9\u5438\u6536\u7269\u8d28\u4e2d\u8fd0\u52a8\u6700\u5feb\u90e8\u5206\u7684\u901f\u5ea6\uff0c\u5355\u4f4d\u4e3a km/s\uff0c\u671d\u5411\u60a8\u4e3a\u8d1f\uff0c\u8fdc\u79bb\u60a8\u4e3a\u6b63\u3002\n\n**\u4e0e\u5e73\u5747\u901f\u5ea6 v_M \u7684\u533a\u522b**\n\u5f53\u5feb\u901f\u7269\u8d28\u4e0e\u8f83\u6162\u3001\u8f83\u5bc6\u7684\u7269\u8d28\u4f4d\u4e8e\u540c\u4e00\u50cf\u7d20\u65f6\uff0c\u5e73\u5747\u901f\u5ea6 v_M \u4ecd\u7136\u8f83\u4f4e\uff1a\u5feb\u901f\u90e8\u5206\u88ab\u7a00\u91ca\u4e86\u3002\u4f8b\u5982\u5728\u7206\u53d1\u548c\u55b7\u6d41\u4e2d\uff0c\u5c11\u91cf\u6c14\u4f53\u4ee5 50 \u81f3 100 km/s \u7684\u901f\u5ea6\u5728\u8f83\u5e73\u9759\u7684\u80cc\u666f\u524d\u8fd0\u52a8\u3002\u6a21\u578b\u53ef\u4ee5\u628a\u8c31\u7ebf\u5206\u89e3\u4e3a\u4e09\u4e2a\u4e91\uff0c\u6b64\u56fe\u663e\u793a\u4f4d\u79fb\u6700\u5927\u7684\u90a3\u4e2a\uff0c\u524d\u63d0\u662f\u5b83\u5438\u6536\u4e86\u53ef\u89c2\u7684\u5149\u3002\u53ea\u9700\u4e00\u4e2a\u4e91\u65f6\uff0c\u6b64\u56fe\u4e0e v_M \u76f8\u540c\u3002\n\n**\u5982\u4f55\u9605\u8bfb**\n\u989c\u8272\u548c\u8272\u6807\u4e0e v_M \u76f8\u540c\uff1a\u84dd\u8272\u671d\u5411\u60a8\uff0c\u7ea2\u8272\u8fdc\u79bb\u60a8\uff0c\u6700\u9ad8 100 km/s\u3002\u6df1\u7070\u8272\uff1a\u6ca1\u6709\u5438\u6536\u7269\u8d28\u3001\u5438\u6536\u592a\u5f31\u65e0\u6cd5\u6d4b\u91cf\uff0c\u6216\u6bd4\u5468\u56f4\u66f4\u4eae\u7684\u533a\u57df\u3002\n\n**\u5c40\u9650**\n\u6a21\u578b\u53ea\u8003\u5bdf\u8c31\u7ebf\u4e2d\u5fc3\u4e24\u4fa7 2.5 \u00c5 \u4ee5\u5185\u7684\u90e8\u5206\uff0c\u7ea6\u5bf9\u5e94 110 km/s\uff1a\u66f4\u5feb\u7684\u7269\u8d28\u770b\u4e0d\u5230\uff0c\u6216\u6d4b\u5f97\u7684\u901f\u5ea6\u504f\u4f4e\u3002\u4f7f\u8c31\u7ebf\u53d8\u4eae\u7684\u5feb\u901f\u6d41\u52a8\uff08\u5982\u8000\u6591\u4e2d\uff09\u4e0e\u660e\u4eae\u533a\u57df\u4e00\u8d77\u88ab\u6392\u9664\u3002
