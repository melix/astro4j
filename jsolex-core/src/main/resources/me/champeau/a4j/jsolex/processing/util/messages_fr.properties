cloud.model.map.bgw=Largeur du fond
cloud.model.map.bgw.description=**Grandeur représentée**\nDe combien la largeur de la raie du fond a dû être modifiée en ce point pour correspondre à l'observation, par rapport à la raie moyenne du disque à la même distance du centre. 0 signifie inchangée, une valeur positive une raie plus étroite, une valeur négative une raie plus large.\n\n**Comment lire la carte**\nBlanc : inchangée. Rouge : plus étroite. Bleu : plus large.
cloud.model.calibration.implausible=Le profil observé ne correspond pas à la raie H-alpha (lumière parasite %.0f %%, résidus %.1f %%). Vérifiez l'instrument, le binning et la taille des pixels, et que le disque n'est pas saturé
cloud.model.saturated.disk=Le modèle de nuage ne peut pas être calculé sur un disque saturé
cloud.model.not.halpha=Le modèle de nuage ne s'applique qu'à la raie H-alpha
cloud.model.chart.velocity.legend.vm=v_M (moyenne)
cloud.model.chart.velocity.legend.ve=v_E (énergie)
cloud.model.chart.velocity.legend.vf=v_F (flux d'énergie)
cloud.model.map.snr=Détection (signal sur bruit)
cloud.model.map.snr.description=**Grandeur représentée**\nÀ quel point la matière absorbante se distingue du bruit en ce point. La valeur compare la raie avec et sans le nuage : 5 signifie que l'absorption est 5 fois plus grande que le bruit.\n\n**Pourquoi c'est important**\nQuand l'absorption est faible, la forme de la raie change à peine, et ni son décalage ni sa largeur ne peuvent être mesurés. En dessous de 5, les vitesses, la température, la fonction source et la largeur Doppler ne sont donc pas affichées (gris foncé sur leurs cartes).\n\n**Comment lire la carte**\nDu violet foncé (pas de détection) au jaune (20 ou plus). Moyenner les pixels voisins avant le calcul augmente cette valeur.
cloud.model.not.enough.samples=Le modèle de nuage a besoin d'au moins %2$d images à moins de 2,5 Å de la raie, mais seulement %1$d sont disponibles
cloud.model.no.reference=Le modèle de nuage n'a trouvé aucun point du disque pour construire le profil de référence
cloud.model.invalid.binning=La taille des blocs moyennés doit valoir au moins 1 (valeur reçue : %d)
cloud.model.unknown.map=Carte du modèle de nuage inconnue : « %s »
cloud.model.invalid.turbulence=La turbulence doit être comprise entre 0 et %2$.1f km/s (valeur reçue : %1$.1f km/s)
cloud.model.map.tau_b=Opacité de la composante bleue
cloud.model.map.tau_c=Opacité de la composante centrale
cloud.model.map.tau_r=Opacité de la composante rouge
cloud.model.map.v_b=Vitesse de la composante bleue
cloud.model.map.v_c=Vitesse de la composante centrale
cloud.model.map.v_r=Vitesse de la composante rouge
cloud.model.map.status=État
