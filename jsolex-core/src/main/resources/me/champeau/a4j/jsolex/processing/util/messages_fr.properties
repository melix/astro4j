cloud.model.map.vm=Vitesse moyenne (v_M)
cloud.model.map.vm.description=**Grandeur représentée**\nLa vitesse à laquelle la matière sombre visible en H-alpha (filaments, fibrilles, spicules) se rapproche ou s'éloigne de vous, en kilomètres par seconde. Seul le mouvement le long de la ligne de visée est mesuré : les déplacements de côté sont invisibles pour cette méthode.\n\n**Comment c'est mesuré**\nQuand un gaz se rapproche de nous, sa raie d'absorption est décalée vers les courtes longueurs d'onde (côté bleu), et vers les grandes longueurs d'onde (côté rouge) quand il s'éloigne. C'est l'effet Doppler. Le modèle mesure ce décalage en chaque point. Quand la raie demande plusieurs nuages animés de vitesses différentes, v_M est leur moyenne pondérée par la masse : la vitesse de l'ensemble de la matière.\n\n**Comment lire la carte**\nBleu : matière qui se rapproche de vous. Rouge : matière qui s'éloigne. Blanc : immobile. L'échelle de couleurs est fixe et couvre -100 à +100 km/s : les couleurs changent vite pour les mouvements lents et plus lentement pour les rapides, pour que les deux se voient sur la même carte. La légende indique où se trouvent 10, 30 et 100 km/s. Près du centre du disque, se rapprocher signifie monter. Les vitesses sont mesurées par rapport à l'atmosphère environnante : la rotation du Soleil a été retirée.\nGris foncé : pas de matière absorbante en ce point, absorption trop faible pour être mesurée, ou région plus brillante que son entourage (plage), où le modèle de nuage ne s'applique pas. Gris moyen : point rejeté (tache solaire, profil anormal ou ajustement trop mauvais). Anneau hachuré au bord du disque : trop près du limbe pour être traité.\n\n**Fiabilité**\nBonne : c'est la vitesse la plus robuste. Comme plusieurs structures se mélangent dans chaque pixel, les valeurs sont plus faibles que celles mesurées avec de grands télescopes.
cloud.model.map.vmax=Écoulement le plus rapide (v_max)
cloud.model.map.vmax.description=**Grandeur représentée**\nLa vitesse de la partie la plus rapide de la matière absorbante en ce point, en km/s, vers vous (négative) ou en s'éloignant (positive).\n\n**Différence avec la vitesse moyenne v_M**\nQuand de la matière rapide partage un pixel avec de la matière plus lente et plus dense, la vitesse moyenne v_M reste faible : la partie rapide est diluée. C'est le cas par exemple des éruptions et des jets, où un peu de gaz se déplace à 50 ou 100 km/s devant un fond plus calme. Le modèle peut découper la raie en trois nuages, et cette carte montre le plus décalé, à condition qu'il absorbe une quantité notable de lumière. Là où un seul nuage suffit, cette carte est identique à v_M.\n\n**Comment lire la carte**\nMêmes couleurs et même échelle que v_M : bleu vers vous, rouge en s'éloignant, jusqu'à 100 km/s. Gris foncé : pas de matière absorbante, absorption trop faible pour être mesurée, ou région plus brillante que son entourage.\n\n**Limites**\nLe modèle n'examine la raie qu'à 2,5 Å de part et d'autre de son centre, ce qui correspond à environ 110 km/s : la matière plus rapide n'est pas vue, ou vue avec une vitesse plus faible. Les écoulements rapides qui rendent la raie plus brillante, comme dans les éruptions, sont laissés de côté avec les régions brillantes.
cloud.model.map.ve=Vitesse énergétique (v_E)
cloud.model.map.ve.description=**Grandeur représentée**\nUne vitesse, en km/s, qui indique à quel point la matière absorbante est agitée, quel que soit le sens du mouvement. Elle est déduite de l'énergie cinétique (l'énergie du mouvement) de la matière divisée par sa masse.\n\n**Différence avec la vitesse moyenne v_M**\nSi une partie d'une structure monte à 10 km/s pendant qu'une autre descend à 10 km/s, la vitesse moyenne v_M est nulle, alors que la matière bouge : v_E en rend compte. v_E inclut aussi les petits mouvements désordonnés (turbulence) à l'intérieur du gaz, que le modèle suppose égaux à 8 km/s. C'est pourquoi v_E est toujours positive et ne descend jamais sous 6 km/s environ.\n\n**Comment lire la carte**\nDu violet foncé (0 km/s) au jaune (30 km/s). Gris foncé : pas de matière absorbante en ce point, absorption trop faible pour être mesurée, ou région plus brillante que son entourage (plage), où le modèle de nuage ne s'applique pas.\n\n**Fiabilité**\nFaible : la turbulence étant une hypothèse fixe, la plupart des valeurs restent entre 6 et 12 km/s. Servez-vous en pour repérer les zones de forts écoulements plutôt que pour ses valeurs absolues.
cloud.model.map.vf=Vitesse du flux d'énergie (v_F)
cloud.model.map.vf.description=**Grandeur représentée**\nUne vitesse, en km/s, qui indique dans quel sens la matière absorbante transporte son énergie cinétique (vers vous ou en s'éloignant), et avec quelle intensité. Elle est déduite du flux d'énergie cinétique divisé par la masse.\n\n**Différence avec la vitesse moyenne v_M**\nL'énergie transportée par un écoulement croît comme le cube de sa vitesse : les écoulements rapides pèsent beaucoup plus que les lents. Un peu de matière qui tombe vite peut donc dominer v_F, même si la plus grande partie de la matière monte lentement. Comme v_F est une racine cubique, même un mouvement lent donne un v_F de plusieurs km/s : les valeurs proches de 0 sont rares, ce qui est normal.\n\n**Comment lire la carte**\nMêmes couleurs et même échelle que v_M, de -100 km/s (bleu, vers vous) à +100 km/s (rouge, en s'éloignant). Gris foncé : pas de matière absorbante en ce point, absorption trop faible pour être mesurée, ou région plus brillante que son entourage (plage), où le modèle de nuage ne s'applique pas.\n\n**Fiabilité**\nMoyenne : elle dépend aussi de la turbulence supposée.
cloud.model.map.t=Température
cloud.model.map.t.description=**Grandeur représentée**\nLa température de la matière absorbante, en kelvins (K). Pour comparaison, la surface visible du Soleil est à environ 5800 K. Les structures visibles en H-alpha sont en général entre 7000 et 15000 K.\n\n**Comment c'est mesuré**\nDans un gaz chaud, les atomes se déplacent vite dans toutes les directions. Leurs décalages Doppler élargissent la raie d'absorption : plus le gaz est chaud, plus la raie est large. Le modèle mesure la largeur de la raie du nuage, retire la part due à la turbulence (supposée égale à 8 km/s), et convertit le reste en température.\n\n**Comment lire la carte**\nDu violet foncé (4000 K) au jaune (15000 K). Gris foncé : pas de matière absorbante en ce point, absorption trop faible pour être mesurée, ou région plus brillante que son entourage (plage), où le modèle de nuage ne s'applique pas. Aussi en gris foncé : une raie si étroite que la turbulence suffit à expliquer sa largeur.\n\n**Fiabilité**\nFaible. L'instrument élargit lui aussi la raie, et cet élargissement est estimé pendant l'étalonnage. Une petite erreur sur cette estimation, ou sur la turbulence supposée, change beaucoup la température. Avec un instrument amateur, chaque point mélange aussi des structures animées de vitesses différentes, ce qui élargit encore la raie : la température est probablement surestimée. Comparez les zones d'une même carte plutôt que de vous fier aux valeurs absolues.
cloud.model.map.m=Masse colonne
cloud.model.map.m.description=**Grandeur représentée**\nLa quantité de matière absorbante en ce point. Imaginez un tube d'un centimètre carré de section, qui part de votre \u0153il et traverse le nuage : la masse colonne est la masse de gaz du nuage contenue dans ce tube, en grammes par centimètre carré (g/cm2). Elle indique combien de matière se trouve le long de la ligne de visée, pas l'épaisseur ni la densité du nuage.\n\n**Comment c'est mesuré**\nPlus l'absorption est forte, plus il y a d'atomes d'hydrogène pour absorber la lumière. Mais seule une infime partie des atomes d'hydrogène peut absorber la lumière H-alpha, et cette part dépend fortement de la température. Le modèle combine donc l'absorption mesurée et la température pour estimer la masse totale.\n\n**Comment lire la carte**\nL'échelle est logarithmique, de 0,00001 à 0,001 g/cm2 : la barre de couleurs couvre un facteur 100. Violet foncé : peu de matière. Jaune : beaucoup de matière. Les points sans absorption significative valent zéro. Gris foncé : la température n'a pas pu être mesurée en ce point, donc la masse, qui en dépend, non plus. Les régions plus brillantes que leur entourage (plages) sont en gris foncé : le modèle de nuage ne s'y applique pas.\n\n**Fiabilité**\nFaible à moyenne : comme elle dépend de la température, les erreurs sur la température se répercutent. L'allure de la carte a un sens, les valeurs absolues donnent un ordre de grandeur.
cloud.model.map.fm=Flux de masse
cloud.model.map.fm.description=**Grandeur représentée**\nLa quantité de matière absorbante qui se déplace le long de la ligne de visée, par seconde : la masse colonne multipliée par la vitesse moyenne v_M, en g/cm/s.\n\n**Comment lire la carte**\nBleu : matière qui s'écoule vers vous. Rouge : matière qui s'éloigne. Une structure massive et lente peut avoir le même flux de masse qu'une structure légère et rapide. L'échelle s'adapte à l'observation. Gris foncé là où la température, et donc la masse, n'a pas pu être mesurée.
cloud.model.map.ek=Énergie cinétique
cloud.model.map.ek.description=**Grandeur représentée**\nL'énergie du mouvement de la matière absorbante contenue dans une colonne d'un centimètre carré le long de la ligne de visée, en erg/cm2 (1 erg = 0,0000001 joule). Elle comprend les écoulements et la turbulence à petite échelle.\n\n**Comment lire la carte**\nDu violet foncé (peu d'énergie) au jaune (beaucoup d'énergie). L'échelle s'adapte à l'observation. Gris foncé là où la température, et donc la masse, n'a pas pu être mesurée.
cloud.model.map.fk=Flux d'énergie cinétique
cloud.model.map.fk.description=**Grandeur représentée**\nL'énergie cinétique transportée par la matière absorbante le long de la ligne de visée, par seconde, en erg/cm/s. C'est la grandeur qui permet de discuter si ces écoulements peuvent chauffer les couches supérieures de l'atmosphère solaire.\n\n**Comment lire la carte**\nBleu : énergie transportée vers vous. Rouge : énergie qui s'éloigne. L'échelle s'adapte à l'observation. Gris foncé là où la température, et donc la masse, n'a pas pu être mesurée.
cloud.model.map.tauw=Absorption intégrée
cloud.model.map.tauw.description=**Grandeur représentée**\nLa quantité de lumière H-alpha que le nuage retire en ce point, en angströms. Elle combine l'opacité du nuage (son épaisseur optique : 0 signifie transparent, au-delà de 1 l'essentiel de la lumière au centre de la raie est bloqué) et la largeur de sa raie d'absorption.\n\n**Pourquoi c'est important**\nC'est la grandeur que l'observation mesure le plus directement : elle ne dépend ni de la température, ni de la turbulence supposée. C'est la carte la plus fiable pour situer les structures absorbantes et comparer leur importance.\n\n**Comment lire la carte**\nDu violet foncé (0 Å, pas d'absorption) au jaune (1 Å). Les filaments apparaissent clairs, les régions calmes sombres. Les régions plus brillantes que leur entourage (plages) sont en gris foncé : le modèle de nuage ne s'y applique pas.
cloud.model.map.s=Fonction source
cloud.model.map.s.description=**Grandeur représentée**\nL'éclat propre du nuage, comparé à la luminosité du continu au centre du disque (0,1 signifie 10 %).\n\n**Explication**\nUn nuage agit de deux façons sur la lumière qui vient d'en dessous : il en absorbe une partie, et il émet sa propre lumière H-alpha. Si son éclat propre est plus faible que la lumière qu'il bloque, le nuage paraît sombre, comme les filaments sur le disque. S'il est plus fort, le nuage paraît brillant, comme les protubérances au-dessus du limbe.\n\n**Comment lire la carte**\nDu violet foncé (0) au jaune (0,4). Gris foncé : pas de matière absorbante en ce point, absorption trop faible pour être mesurée, ou région plus brillante que son entourage (plage), où le modèle de nuage ne s'applique pas.\n\n**Fiabilité**\nMoyenne : elle est mal déterminée quand le nuage est presque transparent.
cloud.model.map.w=Largeur Doppler
cloud.model.map.w.description=**Grandeur représentée**\nLa largeur de la raie d'absorption du nuage, en angströms. La température en est déduite.\n\n**Explication**\nLa largeur vient de l'agitation des atomes : la chaleur et la turbulence à petite échelle. Une raie plus large signifie un gaz plus chaud ou plus turbulent.\n\n**Comment lire la carte**\nDu violet foncé (raie étroite) au jaune (raie large). Gris foncé : pas de matière absorbante en ce point, absorption trop faible pour être mesurée, ou région plus brillante que son entourage (plage), où le modèle de nuage ne s'applique pas.
cloud.model.map.bg=Luminosité du fond
cloud.model.map.bg.description=**Grandeur représentée**\nDerrière chaque nuage, le modèle suppose une atmosphère de fond dont la raie ressemble à la raie moyenne du disque à la même distance du centre. Cette carte montre la luminosité de ce fond en ce point, comparée à cette moyenne (1 signifie la même luminosité).\n\n**Comment lire la carte**\nDe 0,8 (20 % plus sombre) à 1,2 (20 % plus brillant). Les régions brillantes comme les plages sont au-dessus de 1.
cloud.model.map.ncomp=Nombre de composantes
cloud.model.map.ncomp.description=**Grandeur représentée**\nLe nombre de nuages dont le modèle a eu besoin en ce point : 1 ou 3.\n\n**Explication**\nQuand la raie est symétrique, un seul nuage animé d'une seule vitesse suffit. Quand la raie est déformée, par exemple parce qu'une partie de la matière monte pendant qu'une autre descend dans le même pixel, le modèle utilise trois nuages de vitesses différentes : un décalé vers le bleu, un central et un décalé vers le rouge. Ils partagent la même température.\n\n**Comment lire la carte**\n0 : pas d'absorption significative. 1 : un nuage. 3 : trois nuages.
cloud.model.map.chi2=Qualité de l'ajustement
cloud.model.map.chi2.description=**Grandeur représentée**\nLa qualité avec laquelle le modèle reproduit la raie observée en ce point. La valeur est le chi2 réduit : l'écart quadratique moyen entre le modèle et l'observation, divisé par le bruit attendu.\n\n**Comment lire la carte**\nAutour de 1 : le modèle colle à l'observation au bruit près, et les valeurs en ce point sont fiables. Au-dessus de 2 ou 3 : la raie a une forme que le modèle explique mal, prudence avec les autres cartes en ce point. Du vert (bon) au rouge foncé (mauvais), sur une échelle fixe de 0 à 5, pour que deux observations se comparent. Gris moyen : point rejeté, parce que l'ajustement était trop mauvais ou la raie anormale (tache solaire, pixel saturé). Anneau hachuré au bord du disque : trop près du limbe pour être traité.\n\n**Astuce**\nCliquez sur n'importe quelle carte pour voir la raie observée et le modèle ajusté en ce point.
cloud.model.chart.velocities=Répartition de la matière absorbante selon sa vitesse
cloud.model.chart.velocities.title=Distribution des vitesses
cloud.model.chart.velocities.description=**Contenu du graphique**\nPour tous les points du disque où de la matière absorbante a été trouvée, la répartition de cette matière selon sa vitesse. Chaque point compte en proportion de sa masse : les structures massives pèsent plus que les structures ténues. Seuls les points où la température, et donc la masse, a pu être mesurée sont comptés.\n\n**Les trois courbes**\n**v_M**, vitesse moyenne : le mouvement moyen vers vous (négatif) ou en s'éloignant (positif).\n**v_E**, vitesse énergétique : l'agitation de la matière, quel que soit le sens. Elle inclut la turbulence supposée de 8 km/s, elle est donc toujours au-dessus de 6 km/s environ, d'où son pic étroit.\n**v_F**, vitesse du flux d'énergie : le sens dans lequel l'énergie cinétique est transportée, dominé par les écoulements les plus rapides. Comme c'est une racine cubique, elle est rarement proche de 0, d'où ses deux pics.\n\n**Comment lire le graphique**\nL'axe horizontal est la vitesse en km/s, négative vers vous. L'axe vertical est la part de la masse totale par km/s. Une distribution centrée sur 0 signifie autant de matière qui se rapproche que de matière qui s'éloigne. Un décalage, ou une aile plus longue d'un côté, révèle un écoulement dominant.
cloud.model.chart.velocity.axis=Vitesse (km/s, négative vers l'observateur)
cloud.model.chart.mass.fraction.axis=Part de la masse (% par km/s)
cloud.model.chart.calibration=Centre du disque et atlas BASS2000 : largeur %.3f Å, lumière parasite %.1f %%, dispersion x%.3f, décalage %.3f Å, raies telluriques x%.1f
cloud.model.chart.calibration.title=Étalonnage spectral
cloud.model.chart.calibration.description=**Pourquoi cette étape**\nPour interpréter une raie, le modèle doit savoir exactement ce que votre instrument fait subir à la lumière. Il compare la raie moyenne au centre du disque à un spectre de référence du Soleil (l'atlas BASS2000), après avoir simulé votre instrument et l'atmosphère terrestre.\n\n**Les grandeurs estimées**\n**Largeur (FWHM)** : le flou que votre spectrohéliographe applique au spectre, en angströms.\n**Lumière parasite** : de la lumière qui remplit la raie sans en provenir (reflets, diffusion). Au-delà de 20 %, les résultats deviennent douteux.\n**Correction de dispersion** : une petite correction de la taille d'un pixel en angströms. Une valeur négative signifie que le spectre est inversé.\n**Décalage** : le décalage du centre de la raie, en angströms.\n**Raies telluriques** : la profondeur des raies de la vapeur d'eau de l'atmosphère terrestre, qui varie avec l'humidité et la hauteur du Soleil (x1 correspond à une profondeur moyenne).\n\n**Comment lire le graphique**\nEn haut : la raie observée et la référence. Les deux courbes doivent se superposer. En bas : leur différence, en pourcentage. Sous 1 %, l'étalonnage est excellent. Si les courbes divergent nettement, les cartes ne sont pas fiables : vérifiez l'instrument, le binning et la taille des pixels.
cloud.model.chart.wavelength.axis=Écart au centre de la raie (Å)
cloud.model.chart.intensity.axis=Intensité (continu = 1)
cloud.model.chart.residual.axis=Observé - atlas (%)
cloud.model.chart.observed=Observé
cloud.model.chart.atlas=Atlas
