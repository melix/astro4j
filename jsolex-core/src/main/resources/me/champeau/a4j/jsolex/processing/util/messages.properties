cloud.model.map.vm=Mean velocity (v_M)
cloud.model.map.vm.description=**What it shows**\nThe speed at which the dark material seen in H-alpha (filaments, fibrils, spicules) moves towards you or away from you, in kilometres per second. Only the motion along the line of sight is measured: sideways motions are invisible to this method.\n\n**How it is measured**\nWhen gas moves towards us, its absorption line is shifted towards shorter wavelengths (blue side), and towards longer wavelengths (red side) when it moves away. This is the Doppler effect. The model measures this shift at each point. When the line needs several clouds moving at different speeds, v_M is their average weighted by mass: the velocity of the material as a whole.\n\n**How to read it**\nBlue: material coming towards you. Red: material moving away from you. White: at rest. The colour scale is fixed and covers -100 to +100 km/s: the colours change quickly for slow motions and more slowly for fast ones, so that both can be seen on the same map. The legend shows where 10, 30 and 100 km/s are. Near the centre of the disk, coming towards you means rising. Velocities are measured relative to the surrounding atmosphere: the rotation of the Sun has been removed.\nDark grey: no absorbing material at this point, an absorption too weak to be measured, or a region brighter than its surroundings (plage), where the cloud model does not apply. Medium grey: point rejected (sunspot, abnormal profile or poor fit). Hatched ring at the edge of the disk: too close to the limb to be processed.\n\n**Reliability**\nGood: this is the most robust velocity. Since several structures are mixed in each pixel, the values are lower than those measured with large telescopes.
cloud.model.map.vmax=Fastest flow (v_max)
cloud.model.map.vmax.description=**What it shows**\nThe speed of the fastest moving part of the absorbing material at this point, in km/s, towards you (negative) or away from you (positive).\n\n**Difference with the mean velocity v_M**\nWhen fast material shares a pixel with slower and denser material, the mean velocity v_M stays low: the fast part is diluted. This happens for example with eruptions and surges, where a small amount of gas moves at 50 to 100 km/s in front of a quieter background. The model can split the line into three clouds, and this map shows the most shifted one, as long as it absorbs a noticeable amount of light. Where a single cloud is enough, this map is the same as v_M.\n\n**How to read it**\nSame colours and scale as v_M: blue towards you, red away from you, up to 100 km/s. Dark grey: no absorbing material, an absorption too weak to be measured, or a region brighter than its surroundings.\n\n**Limits**\nThe model only looks at the line within 2.5 Å of its centre, which corresponds to about 110 km/s: faster material is not seen, or seen at a lower speed. Fast flows which make the line brighter, as in flares, are left aside with the bright regions.
cloud.model.map.ve=Energy velocity (v_E)
cloud.model.map.ve.description=**What it shows**\nA speed, in km/s, which tells how agitated the absorbing material is, whatever the direction of the motion. It is derived from the kinetic energy (the energy of motion) of the material divided by its mass.\n\n**Difference with the mean velocity v_M**\nIf one part of a structure rises at 10 km/s while another part falls at 10 km/s, the mean velocity v_M is zero, but the material is clearly moving: v_E captures that. v_E also includes the small-scale random motions (turbulence) inside the gas, which the model assumes to be 8 km/s. For this reason, v_E is always positive and never below about 6 km/s.\n\n**How to read it**\nFrom dark violet (0 km/s) to yellow (30 km/s). Dark grey: no absorbing material at this point, an absorption too weak to be measured, or a region brighter than its surroundings (plage), where the cloud model does not apply.\n\n**Reliability**\nLow: since the turbulence is a fixed assumption, most values stay between 6 and 12 km/s. Use it to spot regions with strong flows rather than for its absolute values.
cloud.model.map.vf=Energy flux velocity (v_F)
cloud.model.map.vf.description=**What it shows**\nA speed, in km/s, which tells in which direction the absorbing material carries its kinetic energy (towards you or away from you), and how strongly. It is derived from the kinetic energy flux divided by the mass.\n\n**Difference with the mean velocity v_M**\nThe energy carried by a flow grows with the cube of its speed: fast flows weigh much more than slow ones. A small amount of material falling fast can therefore dominate v_F, even if most of the material slowly rises. Since v_F is a cube root, even a slow motion gives a v_F of several km/s: values close to 0 are rare, which is expected.\n\n**How to read it**\nSame colours and scale as v_M, from -100 km/s (blue, towards you) to +100 km/s (red, away from you). Dark grey: no absorbing material at this point, an absorption too weak to be measured, or a region brighter than its surroundings (plage), where the cloud model does not apply.\n\n**Reliability**\nMedium: it also depends on the assumed turbulence.
cloud.model.map.t=Temperature
cloud.model.map.t.description=**What it shows**\nThe temperature of the absorbing material, in kelvins (K). For comparison, the visible surface of the Sun is at about 5800 K. The structures seen in H-alpha are usually between 7000 and 15000 K.\n\n**How it is measured**\nIn a hot gas, the atoms move fast in all directions. Their Doppler shifts spread the absorption line: the hotter the gas, the broader the line. The model measures the width of the line of the cloud, removes the part due to turbulence (assumed to be 8 km/s), and converts the rest into a temperature.\n\n**How to read it**\nFrom dark violet (4000 K) to yellow (15000 K). Dark grey: no absorbing material at this point, an absorption too weak to be measured, or a region brighter than its surroundings (plage), where the cloud model does not apply. Also dark grey: a line so narrow that the turbulence alone explains its width.\n\n**Reliability**\nLow. The instrument also broadens the line, and this broadening is estimated during the calibration. A small error on this estimate, or on the assumed turbulence, changes the temperature a lot. With amateur instruments, each point also mixes structures moving at different speeds, which broadens the line further: the temperature is likely overestimated. Compare regions within the same map rather than trusting the absolute values.
cloud.model.map.m=Column mass
cloud.model.map.m.description=**What it shows**\nThe quantity of absorbing material at this point. Imagine a tube with a section of 1 square centimetre, going from your eye through the cloud: the column mass is the mass of cloud gas inside this tube, in grams per square centimetre (g/cm2). It tells how much material there is along the line of sight, not how thick or how dense the cloud is.\n\n**How it is measured**\nThe stronger the absorption, the more hydrogen atoms there are to absorb the light. But only a tiny fraction of the hydrogen atoms can absorb H-alpha light, and this fraction depends strongly on the temperature. The model therefore combines the measured absorption and the temperature to estimate the total mass.\n\n**How to read it**\nThe scale is logarithmic, from 0.00001 to 0.001 g/cm2: the colour bar covers a factor of 100. Dark violet: little material. Yellow: a lot of material. Points without significant absorption are at zero. Dark grey: the temperature could not be measured at this point, so the mass, which depends on it, cannot be either. Regions brighter than their surroundings (plages) are in dark grey: the cloud model does not apply there.\n\n**Reliability**\nLow to medium: since it depends on the temperature, the errors on the temperature are carried over. The pattern of the map is meaningful, the absolute values are an order of magnitude.
cloud.model.map.fm=Mass flux
cloud.model.map.fm.description=**What it shows**\nThe amount of absorbing material moving along the line of sight, per second: the column mass multiplied by the mean velocity v_M, in g/cm/s.\n\n**How to read it**\nBlue: material flowing towards you. Red: material flowing away from you. A massive structure moving slowly can have the same mass flux as a light structure moving fast. The scale adapts to the observation. Dark grey where the temperature, and therefore the mass, could not be measured.
cloud.model.map.ek=Kinetic energy
cloud.model.map.ek.description=**What it shows**\nThe energy of motion of the absorbing material contained in a column of 1 square centimetre along the line of sight, in erg/cm2 (1 erg = 0.0000001 joule). It includes both the flows and the small-scale turbulence.\n\n**How to read it**\nFrom dark violet (little energy) to yellow (a lot of energy). The scale adapts to the observation. Dark grey where the temperature, and therefore the mass, could not be measured.
cloud.model.map.fk=Kinetic energy flux
cloud.model.map.fk.description=**What it shows**\nThe kinetic energy carried by the absorbing material along the line of sight, per second, in erg/cm/s. This is the quantity used to discuss whether these flows can heat the upper layers of the solar atmosphere.\n\n**How to read it**\nBlue: energy carried towards you. Red: energy carried away from you. The scale adapts to the observation. Dark grey where the temperature, and therefore the mass, could not be measured.
cloud.model.map.tauw=Integrated absorption
cloud.model.map.tauw.description=**What it shows**\nHow much H-alpha light the cloud removes at this point, in angstroms. It combines how opaque the cloud is (its optical thickness: 0 means transparent, above 1 most of the light at the centre of the line is blocked) and how broad its absorption line is.\n\n**Why it matters**\nThis is the quantity the observation measures most directly: it depends neither on the temperature nor on the assumed turbulence. It is the most reliable map to locate the absorbing structures and compare their strength.\n\n**How to read it**\nFrom dark violet (0 Å, no absorption) to yellow (1 Å). Filaments appear bright, quiet regions dark. Regions brighter than their surroundings (plages) are in dark grey: the cloud model does not apply there.
cloud.model.map.s=Source function
cloud.model.map.s.description=**What it shows**\nHow brightly the cloud glows by itself, compared with the brightness of the continuum at the centre of the disk (0.1 means 10 %).\n\n**Explanation**\nA cloud does two things to the light coming from below: it absorbs part of it, and it emits its own H-alpha light. If its own glow is weaker than the light it blocks, the cloud appears dark, as filaments do on the disk. If it is stronger, the cloud appears bright, as prominences do above the limb.\n\n**How to read it**\nFrom dark violet (0) to yellow (0.4). Dark grey: no absorbing material at this point, an absorption too weak to be measured, or a region brighter than its surroundings (plage), where the cloud model does not apply.\n\n**Reliability**\nMedium: it is poorly determined when the cloud is almost transparent.
cloud.model.map.w=Doppler width
cloud.model.map.w.description=**What it shows**\nThe width of the absorption line of the cloud, in angstroms. The temperature is computed from it.\n\n**Explanation**\nThe width comes from the agitation of the atoms: heat and small-scale turbulence. A broader line means a hotter or more turbulent gas.\n\n**How to read it**\nFrom dark violet (narrow line) to yellow (broad line). Dark grey: no absorbing material at this point, an absorption too weak to be measured, or a region brighter than its surroundings (plage), where the cloud model does not apply.
cloud.model.map.bg=Background brightness
cloud.model.map.bg.description=**What it shows**\nBehind each cloud, the model assumes a background atmosphere whose line looks like the average line of the disk at the same distance from the centre. This map shows how bright this background is at this point, compared with that average (1 means the same brightness).\n\n**How to read it**\nFrom 0.8 (20 % darker) to 1.2 (20 % brighter). Bright regions such as plages are above 1.
cloud.model.map.ncomp=Number of components
cloud.model.map.ncomp.description=**What it shows**\nHow many clouds the model needed at this point: 1 or 3.\n\n**Explanation**\nWhen the line is symmetric, a single cloud moving at one speed is enough. When the line is distorted, for instance because part of the material rises while another part falls within the same pixel, the model uses three clouds at different speeds: one shifted to the blue, one central and one shifted to the red. They share the same temperature.\n\n**How to read it**\n0: no significant absorption. 1: one cloud. 3: three clouds.
cloud.model.map.chi2=Fit quality
cloud.model.map.chi2.description=**What it shows**\nHow well the model reproduces the line observed at this point. The value is the reduced chi-square: the average squared difference between the model and the observation, divided by the expected noise.\n\n**How to read it**\nAround 1: the model matches the observation within the noise, and the values at this point can be trusted. Above 2 or 3: the line has a shape the model does not explain well, so be careful with the other maps at this point. From green (good) to dark red (poor), on a fixed scale from 0 to 5, so that two observations can be compared. Medium grey: point rejected, because the fit was too poor or the line abnormal (sunspot, saturated pixel). Hatched ring at the edge of the disk: too close to the limb to be processed.\n\n**Tip**\nClick on any map to see the observed line and the fitted model at that point.
cloud.model.chart.velocities=Distribution of the absorbing material by velocity
cloud.model.chart.velocities.title=Velocity distribution
cloud.model.chart.velocities.description=**What it shows**\nFor all the points of the disk where absorbing material was found, how this material is spread between velocities. Each point counts in proportion to its mass: massive structures weigh more than faint ones. Only the points where the temperature, and therefore the mass, could be measured are counted.\n\n**The three curves**\n**v_M**, mean velocity: the average motion towards you (negative) or away from you (positive).\n**v_E**, energy velocity: how agitated the material is, whatever the direction. It includes the assumed turbulence of 8 km/s, so it is always above about 6 km/s, which explains its narrow peak.\n**v_F**, energy flux velocity: the direction in which the kinetic energy is carried, dominated by the fastest flows. Since it is a cube root, it is rarely close to 0, hence its two peaks.\n\n**How to read it**\nThe horizontal axis is the velocity in km/s, negative towards you. The vertical axis is the fraction of the total mass per km/s. A distribution centred on 0 means as much material moving towards you as away from you. A shift, or a longer wing on one side, reveals a dominant flow.
cloud.model.chart.velocity.axis=Velocity (km/s, negative towards the observer)
cloud.model.chart.mass.fraction.axis=Fraction of the mass (% per km/s)
cloud.model.chart.calibration=Disk center vs BASS2000 atlas: FWHM %.3f Å, stray light %.1f %%, dispersion x%.3f, offset %.3f Å, telluric lines x%.1f
cloud.model.chart.calibration.title=Spectral calibration
cloud.model.chart.calibration.description=**Why this step is needed**\nTo interpret a line, the model must know exactly what your instrument does to the light. It compares the average line at the centre of the disk with a reference spectrum of the Sun (the BASS2000 atlas), after simulating your instrument and the Earth's atmosphere.\n\n**What is estimated**\n**Width (FWHM)**: how much your spectroheliograph blurs the spectrum, in angstroms.\n**Stray light**: light which fills the line without coming from it (reflections, scattering). Above 20 %, the results become doubtful.\n**Dispersion correction**: a small correction of the size of a pixel in angstroms. A negative value means that the spectrum is reversed.\n**Offset**: the shift of the centre of the line, in angstroms.\n**Telluric lines**: the depth of the lines of the water vapour of the Earth's atmosphere, which varies with humidity and with the height of the Sun (x1 is an average depth).\n\n**How to read it**\nTop: the observed line and the reference. Both curves must overlap. Bottom: their difference, in percent. Below 1 %, the calibration is excellent. If the curves clearly disagree, the maps are not reliable: check the instrument, binning and pixel size settings.
cloud.model.chart.wavelength.axis=Offset from the line center (Å)
cloud.model.chart.intensity.axis=Intensity (continuum = 1)
cloud.model.chart.residual.axis=Observed - atlas (%)
cloud.model.chart.observed=Observed
cloud.model.chart.atlas=Atlas
