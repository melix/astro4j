cloud.model.map.bgw=Background width
cloud.model.map.bgw.description=**What it shows**\nHow much the width of the background line had to be changed at this point to match the observation, compared with the average line of the disk at the same distance from the centre. 0 means unchanged, positive values a narrower line, negative values a broader line.\n\n**How to read it**\nWhite: unchanged. Red: narrower. Blue: broader.
cloud.model.calibration.implausible=The observed profile does not match the H-alpha line (stray light %.0f %%, residuals %.1f %%). Check the instrument, the binning and the pixel size, and that the disk is not saturated
cloud.model.saturated.disk=The cloud model cannot be computed on a saturated disk
cloud.model.not.halpha=The cloud model only applies to the H-alpha line
cloud.model.chart.velocity.legend.vm=v_M (mean)
cloud.model.chart.velocity.legend.ve=v_E (energy)
cloud.model.chart.velocity.legend.vf=v_F (energy flux)
cloud.model.map.snr=Detection (signal to noise)
cloud.model.map.snr.description=**What it shows**\nHow clearly the absorbing material stands out from the noise at this point. The value compares the line with the cloud and without it: 5 means that the absorption is 5 times larger than the noise.\n\n**Why it matters**\nWhen the absorption is weak, the shape of the line hardly changes, and its shift or its width cannot be measured. Below 5, the velocities, the temperature, the source function and the Doppler width are therefore not shown (dark grey on their maps).\n\n**How to read it**\nFrom dark violet (no detection) to yellow (20 or more). Averaging neighbouring pixels before the computation raises this value.
