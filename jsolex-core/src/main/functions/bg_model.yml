name: BG_MODEL
category: BACKGROUND
description:
  fr: "Crée un modèle de fond de ciel à partir d’une image, qui peut par exemple être soustraite de l’image d’origine."
  en: "Creates a BACKGROUND model from an image, which can be used to subtract the BACKGROUND from the original image. "
arguments:
  - name: img
    description: Image(s)
  - name: order
    optional: true
    default: 2
    description:
      fr: "Ordre du polynôme. Une valeur supérieure à 3 n'est pas recommandée."
      en: "Polynomial order. A value higher than 3 is not recommended."
  - name: sigma
    optional: true
    default: 2.5
    description:
      fr: Nombre de sigmas pour la sélection des échantillons.
      en: Number of sigmas for sample selection.
  - name: mask
    optional: true
    description:
      fr: "Masque restreignant les pixels sur lesquels le modèle est calculé (créé avec annulus_mask ou range_mask). Sans masque, le modèle est calculé sur tout ce qui entoure le disque solaire, donc il suit le signal qui s'y trouve."
      en: "Mask restricting the pixels the model is computed from (created with annulus_mask or range_mask). Without a mask the model is computed from everything surrounding the solar disk, so it follows whatever signal is there."
examples:
  - "bg_model(img(0); 2.5; 3)"
  - "bg_model(img: img(0); sigma: 3)"
  - "bg_model(img: img(0); order: 1; mask: annulus_mask(1.3; 1.45))"
