name: CORRECT_LIMB
category: ENHANCEMENT
description:
  fr: "Ramène le limbe solaire sur un cercle. Le limbe est mesuré tout autour du disque, son écart au cercle ajusté est modélisé par quelques harmoniques, puis l'image est déformée radialement pour annuler cet écart. La déformation est complète au limbe et décroît vers le centre du disque, de sorte que les détails internes ne sont pas contraints. Utile pour supprimer l'ondulation du disque due à la turbulence lente dans les animations."
  en: "Brings the solar limb back onto a circle. The limb is measured all around the disk, its deviation from the fitted circle is modelled with a few harmonics, then the image is radially warped to cancel this deviation. The warp is full at the limb and fades towards the center of the disk, so that the inner details are not constrained. Useful to remove the wobbling of the disk caused by slow turbulence in animations."
arguments:
  - name: img
    description: Image(s)
  - name: order
    optional: true
    default: 6
    description:
      fr: "Nombre d'harmoniques du modèle du limbe"
      en: "Number of harmonics of the limb model"
  - name: ref
    optional: true
    description:
      fr: "Image(s) sur lesquelles mesurer la déformation du limbe, lorsque les images à corriger ne le montrent pas bien, par exemple les ailes d'une raie. Avec une liste de références, chaque image est redressée d'après la référence de même rang. Avec une seule référence, toutes les images de la liste sont redressées d'après elle : c'est le cas des images d'un même scan à différents décalages, qui ont exactement la même déformation que la référence. N'utilisez pas une seule référence pour des images de scans différents, car leurs déformations diffèrent."
      en: "Image(s) on which the deformation of the limb is measured, when the images to correct do not show it well, for example the wings of a line. With a list of references, each image is straightened according to the reference at the same index. With a single reference, all the images of the list are straightened according to it: this is the case of the images of the same scan at different shifts, which have exactly the same deformation as the reference. Do not use a single reference for images from different scans, since their deformations differ."
  - name: falloff
    optional: true
    default: 2
    description:
      fr: "Exposant de la décroissance de la correction vers le centre du disque"
      en: "Exponent of the decay of the correction towards the center of the disk"
examples:
  - "correct_limb(img(0))"
  - "correct_limb(img: some_images, order: 4)"
  - "correct_limb(img: wings, ref: centers)"
  - "correct_limb(img: range(-5; 5); ref: img(-5))"
