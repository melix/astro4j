name: DESTRIPE
category: ENHANCEMENT
description:
  fr: "Supprime les bandes horizontales (stries) d'une image. Avec ellipseMode 2, une étape fine supplémentaire supprime aussi les stries locales du ciel, comme les traînées courtes dessinées près du limbe par le halo d'une région brillante, tout en préservant les protubérances et les structures coronales, plus étendues verticalement."
  en: "Removes horizontal banding (stripes) from an image. With ellipseMode 2, an additional fine stage also removes localized streaks from the sky, such as the short trails drawn next to the limb by the halo of a bright region, while preserving prominences and coronal structures, which are taller."
arguments:
  - name: img
    description: Image(s)
  - name: bs
    optional: true
    default: -1
    description:
      fr: "Échelle la plus grande, en pixels, du lissage vertical, ou -1 pour la déduire de la hauteur de l'image. Les structures verticales plus larges que bs sont préservées ; augmentez la valeur pour supprimer des bandes plus larges."
      en: "Coarsest scale, in pixels, of the vertical smoothing, or -1 to derive it from the image height. Vertical structures wider than bs are preserved; increase the value to remove broader banding."
  - name: passes
    optional: true
    default: -1
    description:
      fr: "Nombre de passes, ou -1 pour répéter la correction jusqu'à convergence."
      en: "Number of passes, or -1 to repeat the correction until it converges."
  - name: strips
    optional: true
    default: 0
    description:
      fr: "Nombre de bandes verticales corrigées indépendamment, ou 0 pour le déduire de la largeur. Utilisez 1 pour appliquer une correction constante sur toute la ligne : la correction ne suit plus les variations horizontales des bandes, mais elle ne présente aucune transition visible, ce qui est préférable lorsque l'image contient une grande zone inutilisable comme le disque solaire."
      en: "Number of vertical strips corrected independently, or 0 to derive it from the width. Use 1 to apply a constant correction over the whole line: the correction no longer follows the horizontal variations of the banding, but it has no visible transition, which is preferable when the image contains a large unusable area such as the solar disk."
  - name: ellipseMode
    optional: true
    default: 1
    description:
      fr: "Utilisation du disque solaire : 0 = ignoré (tous les pixels de la ligne), 1 = pixels du disque (défaut), 2 = pixels hors du disque uniquement."
      en: "Solar disk usage: 0 = ignored (all pixels in the line), 1 = pixels inside the disk (default), 2 = pixels outside the disk only."
examples:
  - "destripe(img(0))"
  - "destripe(img: someImage; bs: 192; passes: 2; ellipseMode: 2)"
  - "destripe(img: someImage; bs: 192; strips: 1; ellipseMode: 2)"
