name: DISK_FILL
category: ENHANCEMENT
description:
  fr: "Remplit le disque solaire détecté avec une valeur donnée (par défault, celle du point noir détecté)."
  en: "Fills the detected solar disk with a given value (default is the value of the detected black point)."
arguments:
  - name: img
    description: Image(s)
  - name: fill
    optional: true
    default: detected black point value
    description:
      fr: Valeur de remplissage
      en: Fill value
  - name: radius
    optional: true
    default: 1
    description:
      fr: "Rayon de la zone remplie, en rayons solaires. Une valeur un peu plus grande que 1 remplit aussi une fine bande autour du disque."
      en: "Radius of the filled area, in solar radii. A value slightly larger than 1 also fills a thin band around the disk."
examples:
  - "disk_fill(img(0))"
  - "disk_fill(img: img(0), fill: 200)"
  - "disk_fill(img: img(0), fill: 0, radius: 1.005)"
