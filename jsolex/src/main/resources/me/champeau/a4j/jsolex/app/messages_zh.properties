cloud.model.tab.help=**\u6a21\u578b\u6765\u6e90**\n\u4e91\u6a21\u578b\u7531 J. M. Beckers \u4e8e 1964 \u5e74\u63d0\u51fa\uff0c\u7528\u4e8e\u7814\u7a76 H-alpha \u4e2d\u53ef\u89c1\u7684\u6697\u7ed3\u6784\u3002JSol'Ex \u91c7\u7528 Chae \u7b49\u4eba\u7684\u65b9\u6cd5\uff0c\u201cInference of the physical parameters of H\u03b1-absorbing plasma structures in the quiet Sun\u201d\uff08Astronomy & Astrophysics 706, A123, 2026\uff09\uff0c\u5e76\u9488\u5bf9\u4e1a\u4f59\u592a\u9633\u5355\u8272\u5149\u7167\u76f8\u4eea\u8bb0\u5f55\u7684\u8f6e\u5ed3\u8fdb\u884c\u4e86\u8c03\u6574\uff1a\u80cc\u666f\u662f\u65e5\u9762\u4e0a\u540c\u4e00\u65e5\u5fc3\u8ddd\u5904\u7684\u5e73\u5747\u8c31\u7ebf\uff0c\u4eea\u5668\u6839\u636e BASS2000 \u56fe\u8c31\u5b9a\u6807\u3002\n\n**\u5b81\u9759\u592a\u9633**\n\u8bba\u6587\u7814\u7a76\u7684\u662f\u5b81\u9759\u592a\u9633\uff1a\u8fdc\u79bb\u6d3b\u52a8\u533a\u3001\u6ca1\u6709\u9ed1\u5b50\u3001\u8c31\u6591\u6216\u8000\u6591\u7684\u65e5\u9762\u533a\u57df\uff0c\u8272\u7403\u5728\u90a3\u91cc\u5448\u73b0\u901a\u5e38\u7684\u6697\u7ea4\u7ef4\u548c\u6697\u6591\u7f51\u7edc\u3002\u8bba\u6587\u7684\u5047\u8bbe\u4e5f\u6765\u81ea\u8fd9\u4e9b\u533a\u57df\uff1a\u80cc\u666f\u63a5\u8fd1\u65e5\u9762\u5e73\u5747\u8c31\u7ebf\u3001\u6e4d\u6d41\u7ea6 8 km/s\uff0c\u4ee5\u53ca\u6e29\u5ea6\u4e0e\u80fd\u591f\u5438\u6536 H-alpha \u5149\u7684\u6c22\u539f\u5b50\u6bd4\u4f8b\u4e4b\u95f4\u7684\u5173\u7cfb\u3002\u5728\u6d3b\u52a8\u533a\uff0c\u8fd9\u4e9b\u5047\u8bbe\u4e0d\u518d\u6210\u7acb\uff1a\u8c31\u6591\u548c\u8000\u6591\u6700\u4eae\u7684\u90e8\u5206\u88ab\u6392\u9664\uff0c\u5176\u4ed6\u5730\u65b9\u7684\u6e29\u5ea6\u548c\u8d28\u91cf\u4e5f\u4e0d\u592a\u53ef\u9760\u3002\u6697\u6761\u548c\u6d3b\u52a8\u533a\u8fb9\u7f18\u4ecb\u4e8e\u4e24\u8005\u4e4b\u95f4\uff1a\u5176\u901f\u5ea6\u4ecd\u6709\u610f\u4e49\uff0c\u6e29\u5ea6\u548c\u8d28\u91cf\u5e94\u8c28\u614e\u770b\u5f85\u3002\n\n**\u53cd\u6f14**\nJSol'Ex \u8bb0\u5f55\u4e86\u65e5\u9762\u6bcf\u4e00\u70b9\u7684\u5b8c\u6574 H-alpha \u8c31\u7ebf\u3002\u53cd\u6f14\u662f\u53cd\u5411\u6c42\u89e3\uff1a\u5728\u6bcf\u4e00\u70b9\u5bfb\u627e\u8ba1\u7b97\u8c31\u7ebf\u4e0e\u89c2\u6d4b\u8c31\u7ebf\u6700\u543b\u5408\u7684\u4e91\u3002JSol'Ex \u518d\u7531\u63cf\u8ff0\u8fd9\u6735\u4e91\u7684\u6570\u5b57\u63a8\u5bfc\u51fa\u7269\u7406\u91cf\uff1a\u901f\u5ea6\u3001\u6e29\u5ea6\u3001\u8d28\u91cf\u3002\n\n**\u7ed3\u679c**\n\u56fe\u548c\u56fe\u8868\u88ab\u6dfb\u52a0\u5230\u751f\u6210\u7684\u56fe\u50cf\u4e2d\uff0c\u4f4d\u4e8e"\u4e91\u6a21\u578b"\u7c7b\u522b\u3002\u6bcf\u5f20\u56fe\u90fd\u6709\u81ea\u5df1\u7684"?"\u6309\u94ae\u8bf4\u660e\u5176\u5185\u5bb9\u3002\u70b9\u51fb\u4e00\u5f20\u56fe\uff0c\u53ef\u5728"\u5149\u8c31\u5256\u9762"\u9009\u9879\u5361\u4e2d\u67e5\u770b\u8be5\u70b9\u7684\u89c2\u6d4b\u8c31\u7ebf\u548c\u62df\u5408\u6a21\u578b\u3002\n\n\u6700\u53ef\u9760\u7684\u56fe\u662f\u79ef\u5206\u5438\u6536\u548c\u5e73\u5747\u901f\u5ea6 v_M\u3002\u6e29\u5ea6\u3001\u67f1\u8d28\u91cf\u548c\u80fd\u91cf\u901f\u5ea6 v_E \u4f9d\u8d56\u4e8e\u5047\u8bbe\uff1a\u8bf7\u6bd4\u8f83\u540c\u4e00\u5f20\u56fe\u4e2d\u7684\u4e0d\u540c\u533a\u57df\uff0c\u800c\u4e0d\u8981\u4f9d\u8d56\u5176\u7edd\u5bf9\u503c\u3002\n\n**\u6df1\u7070\u8272\u7684\u70b9**\n\u6bcf\u4e00\u70b9\u7684\u80cc\u666f\u662f\u65e5\u9762\u4e0a\u540c\u4e00\u65e5\u5fc3\u8ddd\u5904\u7684\u5e73\u5747\u8c31\u7ebf\uff0c\u5176\u4e2d\u5df2\u7ecf\u5305\u542b\u4e86\u5e38\u89c1\u7ea4\u7ef4\u7684\u5438\u6536\u3002\u6a21\u578b\u53ea\u6d4b\u91cf\u5438\u6536\u8d85\u8fc7\u8fd9\u4e00\u5e73\u5747\u503c\u7684\u7269\u8d28\u3002\u56e0\u6b64\u8bb8\u591a\u70b9\u663e\u793a\u4e3a\u6df1\u7070\u8272\uff0c\u4f46\u8fd9\u5e76\u4e0d\u662f\u9519\u8bef\uff1a\u8c31\u7ebf\u4e0e\u5e73\u5747\u8c31\u7ebf\u76f8\u4f3c\u7684\u70b9\uff08\u6ca1\u6709\u989d\u5916\u7684\u4e91\uff09\uff0c\u6bd4\u5e73\u5747\u66f4\u4eae\u3001\u50cf\u8c31\u6591\u4e00\u6837\u88ab\u6392\u9664\u7684\u70b9\uff0c\u4ee5\u53ca\u989d\u5916\u5438\u6536\u592a\u5f31\u3001\u6df9\u6ca1\u5728\u566a\u58f0\u4e2d\u7684\u70b9\u3002\u5728\u5b81\u9759\u592a\u9633\u4e0a\uff0c\u8fd9\u4e9b\u70b9\u53ef\u80fd\u8986\u76d6\u65e5\u9762\u7684\u4e00\u534a\u4ee5\u4e0a\u3002\n\n**\u5206\u8fa8\u7387\u4e0e\u6e29\u5ea6**\nChae \u7b49\u4eba\u89c2\u6d4b\u5230 0.16\u2033 \u7684\u7ec6\u8282\uff0c\u6bd4\u53d7\u5927\u6c14\u6e4d\u6d41\u9650\u5236\u7684\u4e1a\u4f59\u8bbe\u5907\u7cbe\u7ec6\u7ea6\u5341\u500d\u3002\u5206\u8fa8\u7387\u8f83\u4f4e\u65f6\uff0c\u6bcf\u4e00\u70b9\u6df7\u5408\u4e86\u4ee5\u4e0d\u540c\u901f\u5ea6\u8fd0\u52a8\u7684\u7ed3\u6784\uff0c\u4f7f\u8c31\u7ebf\u53d8\u5bbd\uff0c\u800c\u6a21\u578b\u628a\u8fd9\u90e8\u5206\u989d\u5916\u7684\u5bbd\u5ea6\u5f53\u4f5c\u70ed\u91cf\u3002\u56e0\u6b64\u6e29\u5ea6\u5f88\u53ef\u80fd\u88ab\u9ad8\u4f30\uff0c\u4f9d\u8d56\u6e29\u5ea6\u7684\u8d28\u91cf\u4e5f\u662f\u5982\u6b64\u3002\u8bf7\u628a\u5b83\u4eec\u7684\u7edd\u5bf9\u503c\u89c6\u4e3a\u6570\u91cf\u7ea7\u3002\n\n**\u8981\u6c42**\n\u5149\u8c31\u91c7\u6837\u7cbe\u7ec6\uff08\u7ea6\u6bcf\u50cf\u7d20 0.12 \u00c5 \u6216\u66f4\u597d\uff09\u7684 H-alpha \u626b\u63cf\u3001\u672a\u9971\u548c\u7684\u65e5\u9762\uff0c\u4ee5\u53ca\u6b63\u786e\u7684\u4eea\u5668\u3001\u50cf\u7d20\u5408\u5e76\u548c\u50cf\u7d20\u5c3a\u5bf8\u8bbe\u7f6e\u3002
