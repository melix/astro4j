differential.rotation.config.geometry.section=Measurement Geometry
differential.rotation.config.limb.longitude=Limb longitude
differential.rotation.config.limb.longitude.tooltip=Heliographic longitude where measurements are centered. Higher values measure closer to the limb where Doppler shifts are larger.
differential.rotation.config.longitude.halfrange=Longitude half-range
differential.rotation.config.longitude.halfrange.tooltip=Half-width of the longitude range around the limb position. Multiple measurements provide redundancy.
differential.rotation.config.longitude.step=Longitude step
differential.rotation.config.longitude.step.tooltip=Step between consecutive longitude samples. Smaller steps mean more measurements but longer processing.
differential.rotation.config.latitude.step=Latitude step
differential.rotation.config.latitude.step.tooltip=Resolution of the latitude scan. Smaller values produce a denser curve but increase processing time.
differential.rotation.config.voigt.halfwidth=Voigt fit half-width
differential.rotation.config.voigt.halfwidth.tooltip=Half-width of the spectral window for Voigt profile fitting. Larger values include more of the line wings but may be affected by blends.
differential.rotation.config.processing.note=Note: Smaller step values mean finer measurements but significantly longer processing times.
differential.rotation.config.noise.section=Noise Reduction
differential.rotation.config.smoothing=Smoothing window
differential.rotation.config.smoothing.tooltip=Width of the smoothing window applied across latitudes. Should be at least 2x the latitude step for effective smoothing.
differential.rotation.config.sigma.rejection=Sigma rejection
differential.rotation.config.sigma.rejection.tooltip=Reject outlier samples that deviate more than N standard deviations from the mean.
differential.rotation.config.sigma.value.tooltip=Number of standard deviations for outlier rejection (typically 2-3).
