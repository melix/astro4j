cloud.fit.none=No significant absorption at this point
cloud.fit.brighter=The line is brighter here than in the surroundings, as in plages: the cloud model, which describes absorbing material, does not apply
cloud.fit.position.tooltip=Position of the point on the Sun: latitude north (N) or south (S) of the solar equator, and longitude east (E) or west (W) of the central meridian, the line joining the poles through the centre of the disk.
cloud.fit.vm.tooltip=Mean velocity of the absorbing material along the line of sight, in km/s: negative when it comes towards you, positive when it moves away. When the model uses several clouds, this is their average weighted by the amount of material.
cloud.fit.vmax.tooltip=Velocity of the fastest cloud at this point, in km/s (negative towards you, positive away from you). It reveals fast material that the mean velocity dilutes, as in eruptions.
cloud.fit.ve.tooltip=Speed matching the energy of motion of the material, in km/s, whatever the direction of the motion. It includes the small random motions inside the gas (turbulence), so it is never close to 0.
cloud.fit.vf.tooltip=Speed matching the energy carried by the material along the line of sight, in km/s: negative towards you, positive away from you. Fast flows count much more than slow ones.
cloud.fit.temperature.tooltip=Temperature of the absorbing material, in kelvins, deduced from the width of its absorption. For comparison, the visible surface of the Sun is at about 5800 K.
cloud.fit.mass.tooltip=Mass of absorbing gas in a column of 1 cm² going from your eye through the cloud, in grams per square centimetre. It depends on the temperature, so it is only shown when the temperature is measured.
cloud.fit.source.tooltip=How brightly the cloud glows by itself, compared with the continuum at the centre of the disk. A cloud looks dark when its own glow is weaker than the light it blocks.
cloud.fit.width.tooltip=Width of the absorption of the cloud, in angstroms. It comes from the heat and the turbulence of the gas, and gives the temperature.
cloud.fit.component.tooltip=When the line is distorted, the model uses three clouds moving at different speeds. For each of them: its opacity (0 means transparent, above 1 it blocks most of the light at the centre of the line) and its velocity (negative towards you, positive away from you).
cloud.fit.background.brightness.tooltip=Brightness of the atmosphere behind the cloud, compared with the average line of the disk at the same distance from the centre: ×1 means the same, above 1 brighter, as in plages.
cloud.fit.background.narrowing.tooltip=How much the width of the background line was changed to match the observation: 0 means unchanged, positive values a narrower line, negative values a broader line.
cloud.fit.chi2.tooltip=How well the model reproduces the observed line: around 1, they agree within the noise. Above 2 or 3, the line has a shape the model explains poorly, and the other values are less reliable.
cloud.fit.snr.tooltip=How clearly the absorption stands out from the noise: 5 means 5 times larger than the noise. Below 5, the velocities and the temperature are not measured.
cloud.summary.group.calibration=Calibration
cloud.summary.group.averages=Disk averages
cloud.summary.fwhm=Instrumental profile
cloud.summary.fwhm.tooltip=Width at half maximum of the blur the instrument adds to the spectrum, measured by comparing the average profile of the disk with the BASS2000 reference atlas. The larger it is, the fewer details of the line the instrument can separate.
cloud.summary.stray=Stray light
cloud.summary.stray.tooltip=Share of the light scattered inside the instrument, which fills the bottom of the line evenly. It is removed before the fit.
cloud.summary.dispersion=Dispersion correction
cloud.summary.dispersion.tooltip=Factor applied to the computed dispersion (angstroms per pixel) so that the observed line matches the atlas. A value close to 1 means that the instrument settings are right.
cloud.summary.offset=Wavelength offset
cloud.summary.offset.tooltip=Difference between the center of the observed line and the center of the line in the atlas. It is corrected before the fit.
cloud.summary.telluric=Telluric lines
cloud.summary.telluric.tooltip=Strength of the absorption lines of the water vapour of the Earth's atmosphere, compared with the atlas. It depends on the humidity and on the height of the Sun at the time of the observation.
cloud.summary.residuals=Residuals
cloud.summary.residuals.tooltip=Average difference between the average profile of the disk and the atlas once the calibration is applied, as a percentage of the continuum. The smaller it is, the better the calibration.
cloud.summary.temperature=Temperature
cloud.summary.temperature.tooltip=Average temperature of the absorbing material, in kelvins, over the points where it could be measured.
cloud.summary.mass=Column mass
cloud.summary.mass.tooltip=Average mass of absorbing gas in a column of 1 cm² seen from the Earth, in grams per square centimeter, over the points where the temperature could be measured.
cloud.summary.vm=Mean velocity |v_M|
cloud.summary.vm.tooltip=Average of the mean velocity of the absorbing material, in km/s, without its sign: material coming towards you and material moving away both count. Only the points where the absorption is clear enough are used.
cloud.summary.ve=Energy velocity v_E
cloud.summary.ve.tooltip=Average of the velocity corresponding to the energy of motion of the material, in km/s, over the points where the absorption is clear enough. It includes the small disordered motions inside the gas.
cloud.summary.vf=Energy flux velocity |v_F|
cloud.summary.vf.tooltip=Average of the velocity corresponding to the energy carried by the material along the line of sight, in km/s, without its sign, over the points where the absorption is clear enough. Fast flows count much more than slow ones.
cloud.summary.energy.flux=Kinetic energy flux
cloud.summary.energy.flux.tooltip=Energy of motion of the absorbing material per square centimeter of the solar surface, divided by 5 minutes, in erg/cm²/s. It assumes that the material is renewed every 5 minutes, as in the article this model comes from: it is an order of magnitude, not a measurement.
cloud.summary.reference=Chae et al. 2026: %s
cloud.summary.reference.tooltip=Average measured by Chae et al. (2026, A&A 706, A123) with the same model, over a small quiet Sun region near the disk center, observed with the FISS spectrograph of the Goode Solar Telescope (1.6 m, Big Bear). This spectrograph has a much finer spectral resolution than a Sol'Ex. The averages of JSol'Ex cover the whole disk, including filaments and active regions: the two values are not expected to be identical, only of the same order of magnitude. With a lower spatial resolution, the temperature and the column mass are likely to come out higher.
