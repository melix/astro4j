cloud.model.tab.title=H-alpha cloud model
cloud.model.tab.description=Fits a cloud model to the H-alpha profile at each point of the disk, to map the velocity, the temperature and the mass of the absorbing material (filaments, fibrils, spicules). The images around the line are reconstructed first, then the maps are added to the generated images. Click on a map to see the fit at that point.
cloud.model.tab.warning=This computation is slow: allow a few minutes.
cloud.model.tab.compute=Compute
cloud.model.tab.step.images=Reconstructing %d images around the line
cloud.model.tab.step.inversion=Fitting the model at each point of the disk
cloud.model.tab.failed=Cloud model inversion failed: {}
cloud.model.tab.help=**Where the model comes from**\nThe cloud model was introduced by J. M. Beckers in 1964 to study the dark structures seen in H-alpha. JSol'Ex follows the method of Chae et al., "Inference of the physical parameters of H\u03b1-absorbing plasma structures in the quiet Sun" (Astronomy & Astrophysics 706, A123, 2026), adapted to the profiles recorded by amateur spectroheliographs: the background is the average line of the disk at the same distance from the centre, and the instrument is calibrated on the BASS2000 atlas.\n\n**The quiet Sun**\nThe paper studies the quiet Sun: the parts of the disk away from active regions, without sunspots, plages or flares, where the chromosphere shows its usual network of dark fibrils and mottles. Its assumptions come from there: a background close to the average line of the disk, a turbulence of about 8 km/s, and the link between the temperature and the share of hydrogen atoms which can absorb H-alpha light. In active regions these assumptions no longer hold: the brightest parts of plages and flares are left aside, and elsewhere the temperature and the mass are less reliable. Filaments and the edges of active regions are in between: their velocities remain meaningful, their temperature and mass should be taken with caution.\n\n**The inversion**\nJSol'Ex has recorded the full H-alpha line at each point of the disk. An inversion works backwards: for each point, it looks for the cloud whose computed line best matches the observed line. From the numbers describing this cloud, JSol'Ex derives physical quantities: velocity, temperature, mass.\n\n**The results**\nThe maps and charts are added to the generated images, in the "Cloud model" category. Each of them has its own "?" button explaining what it shows. Click on a map to see, in the "Spectral profiles" tab, the line observed at that point and the fitted model.\n\nThe most reliable maps are the integrated absorption and the mean velocity v_M. The temperature, the column mass and the energy velocity v_E rely on assumptions: compare regions within a map rather than trusting their absolute values.\n\n**Dark grey points**\nThe background of each point is the average line of the disk at the same distance from the centre, which already contains the absorption of the usual fibrils. The model only measures the material which absorbs more than this average. Many points are therefore left in dark grey without any error: points where the line looks like the average (no extra cloud), points brighter than the average, set aside like plages, and points where the extra absorption is too weak to stand out from the noise. On a quiet Sun, these points can cover more than half of the disk.\n\n**Resolution and temperature**\nChae et al. observed details of 0.16\u2033, about ten times finer than an amateur setup limited by the turbulence of the atmosphere. At lower resolution, each point mixes structures moving at different speeds, which broadens the line, and the model takes this extra width for heat. The temperature is therefore likely overestimated, and so is the mass, which depends on it. Read their absolute values as an order of magnitude.\n\n**Requirements**\nAn H-alpha scan with a fine spectral sampling (about 0.12 Å per pixel or better), a disk which is not saturated, and correct instrument, binning and pixel size settings.
cloud.model.tab.binning=Average neighbouring pixels:
cloud.model.tab.binning.none=None
cloud.model.tab.binning.help=Averaging blocks of pixels before the computation makes it several times faster and slightly reduces the scatter of the velocities, at the cost of resolution. The suggested value matches the finest details your setup can resolve through the turbulence of the atmosphere.
cloud.model.tab.origin=The cloud model was introduced by J. M. Beckers in 1964 to study the dark structures seen in H-alpha. JSol'Ex follows the method of Chae et al., "Inference of the physical parameters of H\u03b1-absorbing plasma structures in the quiet Sun" (Astronomy & Astrophysics 706, A123, 2026), adapted to the profiles recorded by amateur spectroheliographs. The method was designed for the quiet Sun, away from active regions: there, the temperature and the mass are less reliable.
