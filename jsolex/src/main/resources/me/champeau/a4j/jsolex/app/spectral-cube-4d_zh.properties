help.text=4D \u67e5\u770b\u5668\u53ef\u4ee5\u901a\u8fc7**\u6cbf\u4e0d\u540c\u7ef4\u5ea6\u5207\u7247**\u6765\u63a2\u7d22\u5149\u8c31\u6570\u636e\u7acb\u65b9\u4f53\u3002\n\n**\u6ce2\u957f\u5207\u7247**\uff1a\u663e\u793a\u7279\u5b9a\u6ce2\u957f\u4e0b\u91cd\u5efa\u7684\u592a\u9633\u5706\u9762\u3002\u79fb\u52a8\u6ed1\u5757\u53ef\u63a2\u7d22\u6240\u7814\u7a76\u8c31\u7ebf\u7684\u8c31\u7ffc\u3002\n\n**\u5e27/\u72ed\u7f1d\u5207\u7247**\uff1a\u663e\u793a\u5177\u6709\u5178\u578b\u5438\u6536\u8c37\u7684 3D \u5149\u8c31\u5256\u9762\u66f2\u9762\u3002\n\n\u9ed8\u8ba4\u7684\u6ce2\u957f\u5207\u7247\u89c6\u56fe\u4ece\u4e0a\u65b9\u770b\u8d77\u6765\u5f88\u50cf\u91cd\u5efa\u7684\u592a\u9633\u56fe\u50cf\uff0c\u53ea\u662f\u7528 3D \u9ad8\u5ea6\u8868\u793a\u5f3a\u5ea6\uff0c\u800c\u4e0d\u662f\u7528 2D \u50cf\u7d20\u503c\u8868\u793a\u5f3a\u5ea6\u3002\n\n\u6b64\u67e5\u770b\u5668\u4f7f\u7528**\u672a\u7ecf\u4fee\u6539\u7684\u539f\u59cb\u6570\u636e**\uff1a\u5982\u679c X/Y \u6bd4\u7387\u6216\u503e\u89d2\u6821\u6b63\u8bbe\u7f6e\u4e0d\u6b63\u786e\uff0c\u5706\u9762\u53ef\u80fd\u5448\u692d\u5706\u6216\u53d8\u5f62\u3002\n\n\u53ef\u4f7f\u7528\u7f29\u653e\u9009\u62e9\u5668\u6539\u53d8\u5f3a\u5ea6\u6bd4\u4f8b\uff0c\u4ee5\u663e\u793a\u66f4\u7ec6\u5fae\u7684\u7279\u5f81\u3002\n\n\u5e27/\u72ed\u7f1d\u5207\u7247\u663e\u793a\u7684\u66f2\u9762\u4e2d\uff0cX \u8f74\u662f\u72ed\u7f1d\u4f4d\u7f6e\uff08\u6216\u5e27\u53f7\uff09\uff1a\u53ef\u5c55\u793a\u6cbf\u72ed\u7f1d\uff08\u6216\u9009\u62e9\u5e27\u53f7\u65f6\u6cbf\u626b\u63cf\u65f6\u95f4\uff09\u7684\u5149\u8c31\u5256\u9762\u53d8\u5316\u3002\u6ce2\u957f\u8f74\u662f\u5149\u8c31\u7ef4\u5ea6\uff0c\u9ad8\u5ea6\u4ecd\u8868\u793a\u5f3a\u5ea6\u3002\u5438\u6536\u7ebf\u4f1a\u5728\u66f2\u9762\u4e0a\u5f62\u6210\u8c37\u3002\n\n\u4f7f\u7528**\u9f20\u6807\u65cb\u8f6c**\u89c6\u56fe\uff0c\u4f7f\u7528**\u6eda\u8f6e\u7f29\u653e**\u3002
