about.title=\u5173\u4e8e JSol'Ex
about.header=\u592a\u9633\u56fe\u50cf\u5904\u7406\u5668
about.message=JSol'Ex \u662f\u4e00\u6b3e\u514d\u8d39\u8f6f\u4ef6\uff0c\u7528\u4e8e\u5904\u7406\u4f7f\u7528 Christian Buil \u7684 Sol'Ex \u4eea\u5668\u62cd\u6444\u7684\u592a\u9633\u56fe\u50cf\u3002\n\u8f6f\u4ef6\u6309\u73b0\u72b6\u63d0\u4f9b\uff0c\u91c7\u7528 Apache License 2 \u8bb8\u53ef\u3002\u5b83\u6700\u521d\u7528\u4e8e\u7814\u7a76 Sol'Ex \u7684\u5de5\u4f5c\u539f\u7406\uff0c\u5e76\u6df1\u53d7 Val\u00e9rie Desnoux \u7684 INTI \u542f\u53d1\u3002\n\u7279\u522b\u611f\u8c22 Jean-Fran\u00e7ois Pittet \u5728\u6d4b\u8bd5\u548c\u51e0\u4f55\u6821\u6b63\u7b97\u6cd5\u65b9\u9762\u63d0\u4f9b\u7684\u5e2e\u52a9\u3002\n\u611f\u8c22 MLAstro \u7684 Minh Nguyen \u63d0\u51fa\u7684\u5efa\u8bae\u548c\u5927\u91cf\u6d4b\u8bd5\u3002
