requirements.requirements=BASS2000 \u8981\u6c42\uff1a\n\n* \u60a8\u5fc5\u987b\u9605\u8bfb\u5e76\u586b\u5199 https://bass2000.obspm.fr/solex.php \u4e0a\u7684\u8d21\u732e\u8005\u534f\u8bae\uff08PDF \u6587\u4ef6\uff09\n* \u4ec5\u63a5\u53d7\u4f7f\u7528 Sol'Ex\uff08\u539f\u7248\u3001v2\u3001Pro\u3001James\uff09\u548c MLAstro SHG 700 \u62cd\u6444\u7684\u56fe\u50cf\n* \u4ec5\u63a5\u53d7\u5355\u6b21\u626b\u63cf\u7684\u5b8c\u6574\u592a\u9633\u5706\u9762\u56fe\u50cf\uff08\u4e0d\u5141\u8bb8\u53e0\u52a0\u6216\u62fc\u63a5\uff09\n* \u63d0\u4ea4\u7684\u56fe\u50cf\u4e0d\u5f97\u7ecf\u8fc7\u989d\u5916\u53d8\u6362\uff08\u4e0d\u5f97\u589e\u5f3a\u5bf9\u6bd4\u5ea6\uff09\n* \u5fc5\u987b\u8fdb\u884c P \u89d2\u6821\u6b63\n* \u503e\u89d2\u5fc5\u987b\u5c0f\u4e8e 1\u00b0\n* \u652f\u67b6\u5fc5\u987b\u6b63\u786e\u5bf9\u51c6\u6781\u8f74\n* \u5fc5\u987b\u63d0\u4f9b\u6b63\u786e\u7684\u5143\u6570\u636e\n* \u56fe\u50cf\u65b9\u5411\u5fc5\u987b\u6b63\u786e\n* \u6ce2\u957f\u5fc5\u987b\u4e3a H-alpha\u3001H-alpha \u84dd\u4fa7\u8fde\u7eed\u8c31\u3001CaII K\u3001CaII \u84dd\u7ffc\u3001CaII H \u4e2d\u5fc3\u6216 CaII \u84dd\u7ffc\u3002
