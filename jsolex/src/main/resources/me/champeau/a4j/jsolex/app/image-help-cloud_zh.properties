introduction=**\u5438\u6536\u7269\u8d28**\n\u5728 H-alpha \u4e2d\uff0c\u8bb8\u591a\u7ed3\u6784\u5728\u65e5\u9762\u4e0a\u663e\u5f97\u6697\uff1a\u6697\u6761\u3001\u7ea4\u7ef4\u3001\u9488\u72b6\u4f53\u3002\u5b83\u4eec\u7531\u6f02\u6d6e\u5728\u592a\u9633\u660e\u4eae\u8868\u9762\u4e4b\u4e0a\u3001\u4f4d\u4e8e\u8272\u7403\u4e2d\u7684\u6c14\u4f53\u6784\u6210\u3002\u8fd9\u4e9b\u6c14\u4f53\u5438\u6536\u4e86\u6765\u81ea\u4e0b\u65b9\u7684\u90e8\u5206 H-alpha \u5149\uff0c\u4f7f\u5230\u8fbe\u6211\u4eec\u7684\u5149\u53d8\u5c11\uff1a\u8fd9\u4e9b\u6c14\u4f53\u5c31\u662f\u5438\u6536\u7269\u8d28\u3002\n\n**\u8c31\u7ebf\u53ca\u5176\u8f6e\u5ed3**\nH-alpha \u8c31\u7ebf\u662f 656.3 \u7eb3\u7c73\u9644\u8fd1\u4e00\u6bb5\u5f88\u7a84\u7684\u989c\u8272\u8303\u56f4\uff0c\u6c22\u5728\u5176\u4e2d\u5438\u6536\u5149\u3002\u5728\u65e5\u9762\u7684\u6bcf\u4e00\u70b9\uff0cJSol'Ex \u8bb0\u5f55\u4eae\u5ea6\u5728\u8fd9\u4e00\u8303\u56f4\u5185\u5982\u4f55\u53d8\u5316\uff1a\u8fd9\u5c31\u662f\u8c31\u7ebf\u7684\u8f6e\u5ed3\u3002\u5438\u6536\u7269\u8d28\u4f1a\u5728\u8f6e\u5ed3\u4e0a\u7559\u4e0b\u75d5\u8ff9\u3002\n\n**\u4e91\u6a21\u578b**\n\u4e91\u6a21\u578b\u628a\u6bcf\u4e2a\u7ed3\u6784\u770b\u4f5c\u4e00\u6735\u4ece\u540e\u65b9\u88ab\u7167\u4eae\u7684\u4e91\u3002JSol'Ex \u6839\u636e\u8f6e\u5ed3\uff0c\u5728\u6bcf\u4e00\u70b9\u627e\u51fa\u80fd\u89e3\u91ca\u89c2\u6d4b\u7684\u4e91\uff1a\u5b83\u7684\u901f\u5ea6\u3001\u6e29\u5ea6\u548c\u6c14\u4f53\u91cf\u3002\u5728\u8c31\u7ebf\u6bd4\u5e73\u5747\u66f4\u4eae\u7684\u8c31\u6591\u4e2d\uff0c\u6a21\u578b\u4e0d\u9002\u7528\uff0c\u8fd9\u4e9b\u533a\u57df\u88ab\u6392\u9664\u3002\u4e0b\u4e00\u9875\u4ee5\u56fe\u89e3\u5c55\u793a\u5176\u539f\u7406\u3002\n
