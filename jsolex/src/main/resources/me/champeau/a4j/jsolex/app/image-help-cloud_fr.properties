# Cloud model help content - French
introduction=**La matière absorbante**\nEn H-alpha, beaucoup de structures paraissent sombres sur le disque solaire : filaments, fibrilles, spicules. Elles sont faites de gaz qui flotte au-dessus de la surface brillante du Soleil, dans la chromosphère. Ce gaz absorbe une partie de la lumière H-alpha qui vient d'en dessous, si bien que moins de lumière nous parvient : ce gaz est la matière absorbante.\n\n**La raie et son profil**\nLa raie H-alpha est une gamme étroite de couleurs, autour de 656,3 nanomètres, dans laquelle l'hydrogène absorbe la lumière. En chaque point du disque, JSol'Ex enregistre comment la luminosité varie dans cette gamme : c'est le profil de la raie. La matière absorbante laisse sa marque sur ce profil.\n\n**Le modèle de nuage**\nLe modèle de nuage traite chaque structure comme un nuage éclairé par derrière. À partir du profil, JSol'Ex trouve en chaque point le nuage qui explique l'observation : sa vitesse, sa température et sa quantité de gaz. Dans les plages, où la raie est plus brillante que la moyenne, le modèle ne s'applique pas et ces régions sont laissées de côté. La page suivante montre le principe en images.\n
phase1.title=1. La matière absorbante
