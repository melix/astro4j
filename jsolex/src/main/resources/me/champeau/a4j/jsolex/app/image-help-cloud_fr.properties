phase3.away=%.0f km/s en s'éloignant
phase3.caption=La raie sans le nuage reste en place : seule l'absorption du nuage (en couleur) se décale, vers le bleu quand il se rapproche, vers le rouge quand il s'éloigne (effet Doppler). Le décalage donne la vitesse.
phase3.rest=immobile
phase3.absorbed=absorbé par le nuage
phase4.title=4. La température
