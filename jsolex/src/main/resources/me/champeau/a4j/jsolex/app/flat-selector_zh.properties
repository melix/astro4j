frame.title=\u5e73\u573a\u9009\u62e9\u5668
help.message=\u8bf7\u9009\u62e9\u7528\u4e8e\u6821\u6b63\u56fe\u50cf\u7684\u5e73\u573a\u6587\u4ef6\u3002\u8be5\u6587\u4ef6\u7684\u5c3a\u5bf8\u5fc5\u987b\u4e0e\u62cd\u6444 SER \u65f6\u7684\u88c1\u526a\u7a97\u53e3\u5b8c\u5168\u76f8\u540c\u3002\n\u6587\u4ef6\u53ef\u4ee5\u662f SER \u683c\u5f0f\uff08\u4f1a\u81ea\u52a8\u521b\u5efa\u4e3b\u5e73\u573a\uff09\uff0c\u4e5f\u53ef\u4ee5\u662f FITS \u683c\u5f0f\uff08\u76f4\u63a5\u4f7f\u7528\uff09\u3002\n\n\u62cd\u6444\u5e73\u573a\uff1a\n   - \u4f7f\u7528\u4e0e\u62cd\u6444 SER \u6587\u4ef6\u76f8\u540c\u7684\u88c1\u526a\u7a97\u53e3\n   - \u5c06\u592a\u9633\u7f6e\u4e8e\u56fe\u50cf\u4e2d\u592e\uff0c\u8986\u76d6\u5927\u90e8\u5206\u88c1\u526a\u7a97\u53e3\n   - \u7528\u63cf\u56fe\u7eb8\u6216\u767d\u8272\u900f\u660e\u4e66\u76ae\u7b49\u6f2b\u5c04\u6750\u6599\u906e\u4f4f\u671b\u8fdc\u955c\n   - \u8c03\u6574\u66dd\u5149\uff0c\u4f7f\u76f4\u65b9\u56fe\u6700\u5927\u503c\u7ea6\u4e3a\u52a8\u6001\u8303\u56f4\u7684 2/3\n   - \u62cd\u6444\u7ea6 10 \u5e27\u7684 SER \u6587\u4ef6\u3002\n\n\u540c\u4e00\u6ce2\u957f\u7684\u5e73\u573a\u53ef\u5728\u4e0d\u540c\u4f1a\u8bdd\u4e2d\u91cd\u590d\u4f7f\u7528\uff01
select=\u9009\u62e9\u5e73\u573a\u6587\u4ef6\uff08SER \u6216 FITS\uff09
cancel=\u53d6\u6d88
