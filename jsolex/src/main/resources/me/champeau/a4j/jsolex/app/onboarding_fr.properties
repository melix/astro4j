camera.check.title=Caméra différente
camera.check.header=Ce fichier n'a pas été enregistré avec la caméra de votre matériel.
camera.check.content=Dans le fichier : {fileCamera}, pixels de {filePixelSize} µm\nVotre matériel : {camera}, pixels de {pixelSize} µm\n\nLa taille des pixels sert à convertir les pixels en longueurs d'onde. Une valeur fausse donne des mesures de vitesse fausses.
camera.check.keep=Garder mon matériel
camera.check.use.file=Mettre à jour mon matériel
camera.help=Le modèle de la caméra placée derrière le spectrohéliographe, par exemple ZWO ASI178MM. JSol'Ex s'en sert pour trouver la taille de ses pixels.
telescope.help=La lunette ou le télescope sur lequel le spectrohéliographe est monté. Ce nom est inscrit dans les informations des images.
focal.length.help=La distance focale de la lunette, en millimètres. C'est le second nombre de « 80/480 ». Elle figure sur le tube ou dans la documentation.
aperture.help=Le diamètre de l'objectif de la lunette, en millimètres. C'est le premier nombre de « 80/480 ».
mount.help=Le modèle de la monture qui porte la lunette, par exemple SkyWatcher AZ-EQ6 Pro. Ce nom est inscrit dans les informations des images.
observer.help=Votre nom. Il est inscrit dans les images produites.
email.help=Votre adresse e-mail. Elle est inscrite dans les fichiers FITS produits et sert si vous partagez vos observations (BASS2000, SpectroSolHub).
latitude.help=La latitude de votre lieu d'observation, en degrés décimaux, positive au nord de l'équateur. Par exemple 48.85 pour Paris.
longitude.help=La longitude de votre lieu d'observation, en degrés décimaux, positive à l'est de Greenwich. Par exemple 2.35 pour Paris.
spec.name.help=Le nom sous lequel l'instrument apparaîtra dans la liste des spectrohéliographes.
spec.focal.help=La distance focale de l'objectif placé devant la caméra, en millimètres. Elle figure dans la documentation de l'instrument.
spec.collimator.help=La distance focale du collimateur, en millimètres. Le collimateur est la lentille placée juste après la fente : il rend la lumière parallèle avant le réseau.
spec.density.help=Le nombre de traits gravés par millimètre sur le réseau, la pièce qui étale la lumière en spectre. La plupart des spectrohéliographes ont un réseau de 2400 traits/mm.
spec.slit.width.help=La largeur de la fente, en micromètres. Une fente plus fine donne un spectre plus net mais laisse passer moins de lumière.
spec.slit.height.help=La hauteur de la fente, en millimètres. Elle fixe la bande du Soleil couverte à chaque passage.
spec.slit.help=La largeur de la fente, en micromètres, et sa hauteur, en millimètres. La fente est la fine ouverture par laquelle la lumière du Soleil entre dans l'instrument.
