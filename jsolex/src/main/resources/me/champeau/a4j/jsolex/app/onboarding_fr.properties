tour.invite.text=Voulez-vous une courte visite de l'écran ? Elle présente les différentes zones en quelques étapes.
tour.invite.accept=Faire la visite
tour.invite.decline=Non merci
tour.previous=Précédent
tour.next=Suivant
tour.finish=Terminer
tour.quit=Quitter la visite
tour.count=%d / %d
tour.images.title=Vos images
tour.images.text=Toutes les images produites par le traitement, rangées par famille : reconstruction, images brutes, traitées, colorisées\u2026\n\nCliquez sur un nom pour afficher l'image au centre. Le nombre à côté d'un nom, comme +15, indique le décalage en pixels utilisé pour cette image.
tour.image.title=L'image
tour.image.text=Faites tourner la molette pour zoomer et glissez pour vous déplacer.\n\nCliquer sur le **?** vous donnera des explications sur l'image que vous voyez : ce qu'elle montre ou comment elle a été créée. Vous pourrez trouver ce **?** partout où des explications s'imposent.
tour.adjustments.title=Retoucher l'image affichée
tour.adjustments.text=Le nom de l'image et ses outils.\n\n**Retouches** règle la luminosité et le contraste sans relancer le traitement. **Orientation** tourne ou retourne l'image. **Enregistrer** sauvegarde l'image affichée.
tour.panels.title=Les panneaux
tour.panels.text=Le profil spectral permet de vérifier que la bonne raie a été trouvée : la courbe mesurée doit suivre la courbe de référence.\n\nLa liste en haut donne accès aux autres panneaux : journal, statistiques, décalages Doppler, script\u2026
tour.status.title=Le bilan du traitement
tour.status.text=La **raie détectée** : vérifiez qu'il s'agit bien de celle que vous visiez.\n\n**Inclinaison** et **X/Y** décrivent la qualité de la prise de vue. En vert tout va bien. En orange ou en rouge, la fente était inclinée ou la vitesse de balayage mal adaptée.
tour.sharing.title=Partagez vos images
tour.sharing.text=Le bouton de partage, à côté de la liste des panneaux, ouvre ce panneau de publication.\n\n**BASS2000** : vos images ont un intérêt scientifique. Soumettez-les à la base de données solaire professionnelle pour aider la recherche.\n\n**SpectroSolHub** : le site communautaire des spectrohéliographes, avec animations sur plusieurs jours, cartes synoptiques et suivi des taches.\n\n**Direct SpectroSolHub**, en haut à droite, diffuse en direct les images que vous traitez. Tout est aussi dans le menu **Partage**.
tour.tools.title=D'autres outils
tour.tools.text=Le menu **Outils** propose d'autres outils :\n\n\u2022 **Explorateur de spectre** : parcourir le spectre solaire et repérer les raies à observer.\n\u2022 **Calculatrice de temps d'exposition optimal** : trouver le temps de pose et la cadence adaptés à votre matériel.\n\u2022 **Empilement d'images et création de mosaïques** : combiner plusieurs images pour réduire le bruit ou couvrir tout le disque.\n\u2022 **Analyseur de vidéo** : examiner un fichier SER image par image.\n\u2022 **Editeur ImageMath** : écrire des scripts pour créer vos propres images.
tour.next.title=Et ensuite ?
tour.next.text=Pour traiter un autre fichier : **Fichier \u203a Ouvrir un fichier SER**, ou **Fichier \u203a Fichiers récents**.\n\nVotre matériel se modifie dans le menu **Matériel**. Cette visite reste disponible dans **Aide \u203a Visite guidée**.
