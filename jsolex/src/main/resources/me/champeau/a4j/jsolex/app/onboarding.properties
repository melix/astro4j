camera.check.title=Different camera
camera.check.header=This file was not recorded with the camera of your equipment.
camera.check.content=In the file: {fileCamera}, {filePixelSize} µm pixels\nYour equipment: {camera}, {pixelSize} µm pixels\n\nThe pixel size is used to convert pixels into wavelengths. A wrong value gives wrong speed measurements.
camera.check.keep=Keep my equipment
camera.check.use.file=Update my equipment
camera.help=The model of the camera placed behind the spectroheliograph, for example ZWO ASI178MM. JSol'Ex uses it to find the size of its pixels.
telescope.help=The refractor or telescope the spectroheliograph is mounted on. This name is written in the information of the images.
focal.length.help=The focal length of the telescope, in millimetres. It is the second number of "80/480". It is written on the tube or in the documentation.
aperture.help=The diameter of the telescope objective, in millimetres. It is the first number of "80/480".
mount.help=The model of the mount carrying the telescope, for example SkyWatcher AZ-EQ6 Pro. This name is written in the information of the images.
observer.help=Your name. It is written on the generated images.
email.help=Your e-mail address. It is written in the generated FITS files and is used if you share your observations (BASS2000, SpectroSolHub).
latitude.help=The latitude of your observation site, in decimal degrees, positive north of the equator. For example 48.85 for Paris.
longitude.help=The longitude of your observation site, in decimal degrees, positive east of Greenwich. For example 2.35 for Paris.
spec.name.help=The name under which the instrument will appear in the list of spectroheliographs.
spec.focal.help=The focal length of the lens placed in front of the camera, in millimetres. It is given in the documentation of the instrument.
spec.collimator.help=The focal length of the collimator, in millimetres. The collimator is the lens placed just after the slit: it makes the light parallel before the grating.
spec.density.help=The number of lines engraved per millimetre on the grating, the part which spreads the light into a spectrum. Most spectroheliographs have a 2400 lines/mm grating.
spec.slit.width.help=The width of the slit, in micrometres. A thinner slit gives a sharper spectrum but lets less light through.
spec.slit.height.help=The height of the slit, in millimetres. It sets the band of the Sun covered by each pass.
spec.slit.help=The width of the slit, in micrometres, and its height, in millimetres. The slit is the thin opening through which sunlight enters the instrument.
tour.invite.title=Your first processing is done
tour.invite.text=Would you like a short tour of the window? It presents its different areas in a few steps.
tour.invite.accept=Take the tour
tour.invite.decline=No thanks
tour.previous=Previous
tour.next=Next
tour.finish=Finish
tour.quit=Leave the tour
tour.count=%d / %d
tour.images.title=Your images
tour.images.text=All the images produced by the processing, grouped by family: reconstruction, raw images, processed, colorized\u2026\n\nClick a name to display the image in the middle. The number next to a name, such as +15, is the pixel shift used for this image.
tour.image.title=The image
tour.image.text=Use the mouse wheel to zoom and drag to move around.\n\nClicking the **?** gives you explanations about the image you are looking at: what it shows or how it was created. You will find this **?** wherever explanations are needed.
tour.adjustments.title=Adjust the displayed image
tour.adjustments.text=The name of the image and its tools.\n\n**Adjustments** changes the brightness and the contrast without processing the file again. **Orientation** rotates or flips the image. **Save** saves the displayed image.
tour.panels.title=The panels
tour.panels.text=The spectral profile lets you check that the right line was found: the measured curve should follow the reference curve.\n\nThe list at the top gives access to the other panels: logs, statistics, Doppler shifts, script\u2026
tour.status.title=The processing summary
tour.status.text=The **detected line**: check that it is the one you were aiming at.\n\n**Tilt** and **X/Y** describe the quality of the capture. Green means that all is well. Orange or red means that the slit was tilted or that the scan speed was not suitable.
tour.sharing.title=Share your images
tour.sharing.text=The share button, next to the list of panels, opens this publishing panel.\n\n**BASS2000**: your images are of scientific interest. Submit them to the professional solar database to help research.\n\n**SpectroSolHub**: the community site for spectroheliographs, with animations over several days, synoptic maps and sunspot tracking.\n\n**SpectroSolHub Live**, at the top right, broadcasts the images you process. Everything is also available in the **Sharing** menu.
tour.tools.title=More tools
tour.tools.text=The **Tools** menu offers other tools:\n\n\u2022 **Spectrum browser**: explore the solar spectrum and find the lines to observe.\n\u2022 **Optimal exposure calculator**: find the exposure time and the frame rate suited to your equipment.\n\u2022 **Stacking and creation of mosaics**: combine several images to reduce the noise or to cover the whole disk.\n\u2022 **Video analyzer**: look at a SER file frame by frame.\n\u2022 **ImageMath editor**: write scripts to create your own images.
tour.next.title=What next?
tour.next.text=To process another file: **File \u203a Open SER file**, or **File \u203a Recent files**.\n\nYour equipment can be changed in the **Equipment** menu. This tour remains available in **Help \u203a Guided tour**.
