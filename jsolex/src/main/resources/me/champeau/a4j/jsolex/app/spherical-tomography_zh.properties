help.text=\u6b64\u89c6\u56fe\u53ef\u5e2e\u52a9\u60a8\u7406\u89e3\u592a\u9633\u4e0a\u7684\u7279\u5b9a\u7ed3\u6784\u51fa\u73b0\u5728\u54ea\u4e9b\u9ad8\u5ea6\u3002\u4f8b\u5982\uff0c\u592a\u9633\u9ed1\u5b50\u5f62\u6210\u4e8e\u8272\u7403\u5c42\u5185\u4fa7\uff0c\u800c\u6697\u6761\u901a\u5e38\u51fa\u73b0\u5728\u66f4\u9ad8\u4f4d\u7f6e\u3002\u89c6\u56fe\u7ec4\u5408\u4e86\u5728 5 \u4e2a\u4e0d\u540c\u50cf\u7d20\u504f\u79fb\u5904\u91cd\u5efa\u7684\u56fe\u50cf\uff0c\u8ba9\u6211\u4eec\u80fd\u770b\u5230\u4e0d\u540c\u9ad8\u5ea6\u4e0a\u7684\u7ed3\u6784\uff0c\u4eff\u4f5b\u5728\u8272\u7403\u5c42\u4e2d\u7a7f\u884c\u3002\n\n\u4e0d\u8fc7\uff0c\u6b64\u89c6\u56fe**\u4e0d\u80fd\u51c6\u786e\u8868\u793a\u7ed3\u6784\u7684\u5c3a\u5bf8**\u3002\u5f84\u5411\u653e\u5927\u500d\u6570\u7528\u4e8e\u201c\u6269\u5c55\u201d\u8272\u7403\u5c42\u539a\u5ea6\uff0c\u4ee5\u4fbf\u89c2\u5bdf\u7ec6\u8282\uff0c\u5e76\u4e0d\u4ee3\u8868\u771f\u5b9e\u6bd4\u4f8b\u3002\u5b9e\u9645\u4e0a\uff0c\u6211\u4eec\u65e0\u6cd5\u786e\u5b9a\u6697\u6761\u5ef6\u4f38\u7684\u771f\u5b9e\u9ad8\u5ea6\uff0c\u56e0\u6b64\u5b83\u4eec\u4f1a\u5728\u6700\u5916\u5c42\u5448\u73b0\u4e3a\u201c\u5e73\u9762\u201d\u3002\u4f46\u5176\u5b9e\u9645\u5ef6\u4f38\u9ad8\u5ea6\u53ef\u80fd\u8fdc\u9ad8\u4e8e\u89c6\u56fe\u6240\u793a\uff1a\u65e5\u73e5\u5c31\u662f\u4ece\u4fa7\u9762\u770b\u5230\u7684\u6697\u6761\uff0c\u53ef\u5e2e\u52a9\u7406\u89e3\u5b83\u4eec\u53ef\u80fd\u5ef6\u4f38\u591a\u8fdc\u3002\u8bf7\u59cb\u7ec8\u6ce8\u610f\uff0c\u8fd9\u79cd\u8868\u793a\u65b9\u5f0f\uff08\u5c24\u5176\u662f\u5355\u8272\u7248\u672c\uff09\u5e76\u975e\u201c\u771f\u5b9e\u201d\u518d\u73b0\uff0c\u53ea\u662f\u5e2e\u52a9\u7406\u89e3\u8272\u7403\u5c42\u7ed3\u6784\u3002\n\n%ILLUSTRATION%\n\n\u5f69\u8272\u7248\u672c\u91c7\u7528\u6a21\u578b\uff0c\u6839\u636e\u4e0d\u540c\u56fe\u5c42\u4e2d\u533a\u57df\u53d8\u6697\u7684\u7a0b\u5ea6\u8ba1\u7b97\u5404\u5c42\u900f\u660e\u5ea6\uff0c\u56e0\u6b64\u80fd\u63d0\u4f9b\u66f4\u591a\u4fe1\u606f\u3002\u9009\u62e9\u7ea2\u5230\u84dd\u8272\u56fe\u65f6\uff0c\u7ea2\u8272\u533a\u57df\u6bd4\u84dd\u8272\u533a\u57df\u66f4\u900f\u660e\uff0c\u56e0\u4e3a\u5149\u7ebf\u4ece\u5149\u7403\u5c42\uff08\u7ea2\u8272\uff09\u4f20\u64ad\u5230\u8272\u7403\u5c42\u5916\u4fa7\u65f6\uff0c\u6ca1\u6709\u53d7\u5230\u8f83\u4e0d\u900f\u660e\u533a\u57df\u7684\u906e\u6321\u3002\u56e0\u6b64\uff0c\u4f2a\u5f69\u8272\u53ef\u4ee5\u5e2e\u52a9\u611f\u53d7\u4e0d\u540c\u73b0\u8c61\u7684\u76f8\u5bf9\u9ad8\u5ea6\u3002\u4f46\u5b83\u540c\u6837**\u4e0d\u662f**\u7cbe\u786e\u8868\u793a\u3002
