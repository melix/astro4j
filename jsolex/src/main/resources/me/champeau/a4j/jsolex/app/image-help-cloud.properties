# Cloud model help content - English
introduction=**The absorbing material**\nIn H-alpha, many structures look dark on the solar disk: filaments, fibrils, spicules. They are made of gas floating above the bright surface of the Sun, in the chromosphere. This gas absorbs part of the H-alpha light coming from below, so that less light reaches us: this gas is the absorbing material.\n\n**The line and its profile**\nThe H-alpha line is a narrow range of colours, around 656.3 nanometres, in which hydrogen absorbs light. At each point of the disk, JSol'Ex records how the brightness varies across this range: this is the profile of the line. The absorbing material leaves its mark on this profile.\n\n**The cloud model**\nThe cloud model treats each structure as a cloud lit from behind. From the profile, JSol'Ex finds, at each point, the cloud which explains the observation: its speed, its temperature and its quantity of gas. In plages, where the line is brighter than on average, the model does not apply and these regions are left aside. The next page shows the principle in pictures.\n
